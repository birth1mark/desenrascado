function renderBuildingModal() {
    // Vinheta suave sobre o interior (o interior da loja permanece visível a toda a volta)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
    ctx.fillRect(0, 0, canvas.width, 295);

    const mx = 40;
    const my = 14;
    const mw = 560;
    const mh = 267;

    // Caixa Principal em vidro fosco elegante (translucent glass)
    ctx.fillStyle = 'rgba(11, 15, 25, 0.88)';
    ctx.strokeStyle = modalBuilding.color;
    ctx.lineWidth = 2;
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeRect(mx, my, mw, mh);

    // Cabeçalho da Loja
    ctx.fillStyle = modalBuilding.color;
    ctx.fillRect(mx, my, mw, 34);

    ctx.fillStyle = '#ffffff';
    ctx.font = '9px "Press Start 2P"';
    ctx.textAlign = 'left';
    ctx.fillText(`${modalBuilding.icon} ${modalBuilding.name.toUpperCase()} — ${modalBuilding.tag}`, mx + 14, my + 22);

    // Botão Fechar X
    const isHoverX = (mouse.x >= mx + mw - 32 && mouse.x <= mx + mw - 6 && mouse.y >= my + 4 && mouse.y <= my + 30);
    ctx.fillStyle = isHoverX ? '#fca5a5' : '#ef4444';
    ctx.font = 'bold 16px "Fira Code"';
    ctx.textAlign = 'center';
    ctx.fillText("✕", mx + mw - 18, my + 23);

    // 1. COLUNA ESQUERDA: RETRATO PIXEL ART & DIÁLOGO SATÍRICO
    const px = mx + 14;
    const py = my + 44;
    const pSize = 104;

    drawNpcPortrait(modalBuilding.id, px, py, pSize);

    // Nome & Papel do NPC abaixo do retrato
    const npc = NPC_INFO[modalBuilding.id] || NPC_INFO.senhorio;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 10px "Fira Code"';
    ctx.textAlign = 'center';
    ctx.fillText(npc.name, px + pSize / 2, py + pSize + 14);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '8.5px "Fira Code"';
    ctx.fillText(npc.role, px + pSize / 2, py + pSize + 27);

    // Balão de Diálogo Satírico com limite rígido (nunca transborda a caixa)
    const quoteY = py + pSize + 36;
    const quoteW = pSize + 12;
    const quoteH = 64;

    ctx.fillStyle = '#090d16';
    ctx.fillRect(px - 4, quoteY, quoteW, quoteH);
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    ctx.strokeRect(px - 4, quoteY, quoteW, quoteH);

    // Aspas decorativas discretas
    ctx.fillStyle = '#64748b';
    ctx.font = 'bold 12px "Fira Code"';
    ctx.textAlign = 'left';
    ctx.fillText("“", px, quoteY + 13);

    const quoteText = (typeof npc.quote === 'function') ? npc.quote() : (npc.getQuote ? npc.getQuote() : npc.quote);
    wrapTextCanvas(ctx, quoteText, px + 8, quoteY + 14, quoteW - 14, 11, 'italic 8px "Fira Code"', '#cbd5e1', 'left', quoteY + quoteH - 6);

    // 2. COLUNA DIREITA: CARTÕES DE AÇÃO INTERATIVOS
    renderBuildingActions(modalBuilding.id, mx, my, mw, mh);
}

function renderBuildingActions(id, mx, my, mw, mh) {
    let actions = [];

    if (id === 'casa') {
        if (player.houseIndex === 0) {
            actions = [
                { label: "Dormitar no Banco", cost: 0, timeH: 1, timeM: 0, sanity: 5, desc: "Descanso leve ao relento. +5 Sanidade." },
                { label: "Comer Atum de Conserva", cost: 0, timeH: 0, timeM: 15, eatHome: true, desc: `${player.groceries} latas na despensa. +45 Nutrição.` },
                { label: "Passar Noite no Rossio", cost: 0, timeH: 0, timeM: 0, sleepNight: true, desc: "Passa a noite ao relento até amanhã." }
            ];
        } else {
            actions = [
                { label: "Sesta Reparadora (1h)", cost: 0, timeH: 1, timeM: 0, sanity: 20, desc: "Descansa na cama. +20 Sanidade." },
                { label: "Cozinhar Refeição", cost: 0, timeH: 0, timeM: 30, eatHome: true, desc: `${player.groceries} disponíveis. +45 Nutrição.` },
                { label: "Dormir / Terminar o Dia", cost: 0, timeH: 0, timeM: 0, sleepNight: true, desc: "Dorme em paz até à manhã seguinte." },
                { label: "Remendar Roupa (Linha e Agulha)", cost: 12, timeH: 0, timeM: 30, repairClothing: true, desc: `Roupa atual: ${player.clothing.name} (${player.clothing.durability}%). +40% Durabilidade.` }
            ];
        }
    } else if (id === 'senhorio') {
        const nextHouse = HOUSES[Math.min(HOUSES.length - 1, player.houseIndex + 1)];
        const currentRent = HOUSES[player.houseIndex].rent;

        if (player.houseIndex === 0) {
            actions = [
                { label: `Alugar: ${nextHouse.name}`, cost: nextHouse.rent, timeH: 1, timeM: 0, upgradeHouse: true, desc: `${nextHouse.rent}€/sem · ${nextHouse.qual}` }
            ];
        } else {
            if (player.daysUntilRent > 3) {
                actions.push({
                    label: "Renda em Dia (✓)",
                    rentPaid: true,
                    desc: `Faltam ${player.daysUntilRent} dias para o próximo vencimento. Tudo regularizado!`
                });
            } else {
                actions.push({
                    label: `Pagar Renda (${currentRent}€)`,
                    cost: currentRent,
                    payRent: true,
                    timeH: 0,
                    timeM: 15,
                    desc: `Vence em ${player.daysUntilRent} dia(s) · Renova o contrato por 7 dias.`
                });
            }

            if (player.houseIndex < HOUSES.length - 1) {
                actions.push({
                    label: `Mudar: ${nextHouse.name}`,
                    cost: nextHouse.rent,
                    timeH: 1,
                    timeM: 0,
                    upgradeHouse: true,
                    desc: `${nextHouse.rent}€/sem · ${nextHouse.qual}`
                });
            }
        }
    } else if (id === 'faculdade') {
        // ====================================================================
        // UNIVERSIDADE (IST): CURSOS UNIVERSITÁRIOS & CARREIRA DOCENTE
        // ====================================================================
        if (!player.enrolledCourse) {
            actions.push({
                label: "Matrícula: Eng. Informática (IST)",
                cost: 30,
                enrollCourse: 'informatica',
                desc: "Habilita carreira no Tech Hub / Startups (Dev, Cloud, CTO)."
            });
            actions.push({
                label: "Matrícula: Economia & Banca (IST/ISEG)",
                cost: 30,
                enrollCourse: 'economia',
                desc: "Habilita carreira na Caixa / Banco (Crédito, Gestor, Diretor)."

                label: "Matrícula: Matemática Aplicada (IST)",
                cost: 30,
                enrollCourse: 'matematica',
                desc: "Habilita carreira docente no IST (Monitor Álgebra, Professor)."
            });
            actions.push({
                label: "Matrícula: Gestão & Logística (IST)",
                cost: 30,
                enrollCourse: 'gestao',
                desc: "Habilita carreira de Chefia e Gerência no Pingo Doce."

            const curCourse = COURSES[player.enrolledCourse];

            // Cadeiras do Curso
            actions.push({
                label: `Cadeira: ${curCourse.subjects[0].name}`,

                timeM: 0,
                ects: 15,
                studyCourse: curCourse.id,

                        promoteCareer: 'faculdade',
                        reqCourse: nextTeachJob.reqCourse,
                        minCourseEcts: nextTeachJob.minCourseEcts,

                cost: 30,
                resetCourse: true,
                desc: `Curso atual: ${curCourse.name}. Clica para mudar de curso.`
            });
        }
    } else if (id === 'banco') {

        // ====================================================================

            }
            descText += '...';

        ctx.fillText(descText, ax + 14, ay + 36);

        let btnText = "";
        let btnColor = "#10b981";
        let isAffordable = true;

        if (act.cost !== undefined) {
            btnText = `${act.cost}€`;
            if (player.wallet < act.cost) {

// ============================================================================
// 7. INTERAÇÃO E CLIQUES DO UTILIZADOR
// ============================================================================
const mouse = { x: 0, y: 0 };

function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

canvas.addEventListener('mousemove', (e) => {
    const c = getCanvasCoords(e);
    mouse.x = c.x;
    mouse.y = c.y;

    if (state === 'BOARD') {
        const isHover = BUILDINGS.some(b => c.x >= b.x && c.x <= b.x + b.w && c.y >= b.y && c.y <= b.y + b.h);
        canvas.style.cursor = isHover ? 'pointer' : 'default';
    } else {
        canvas.style.cursor = 'default';
    }
});

canvas.addEventListener('click', (e) => {
    initAudio();
    const c = getCanvasCoords(e);
    handleCanvasClick(c.x, c.y);
});

function handleCanvasClick(cx, cy) {
    if (state === 'TITLE') {
        if (cx >= 180 && cx <= 460 && cy >= 250 && cy <= 280) {
            sfxAction();
            openLeaderboard();
            return;
        }
        sfxCoin();
        state = 'NEWS';
        currentEvent = null;
        startBGM();
        return;
    }

    if (state === 'NEWS') {
        sfxAction();
        state = 'BOARD';
        startBGM();
        return;
    }

    if (state === 'GAMEOVER') {
        if (cx >= 45 && cx <= 170 && cy >= 278 && cy <= 314) {
            resetGame();
        } else if (cx >= 180 && cx <= 325 && cy >= 278 && cy <= 314) {
            if (isScoreSubmitted) openLeaderboard();
            else openSubmitModal();
        } else if (cx >= 335 && cx <= 465 && cy >= 278 && cy <= 314) {
            shareScorecard();
        } else if (cx >= 475 && cx <= 595 && cy >= 278 && cy <= 314) {
            shareImageCard();
        }
        return;
    }

    if (state === 'VICTORY') {
        if (cx >= 80 && cx <= 220 && cy >= 250 && cy <= 290) {
            if (isScoreSubmitted) openLeaderboard();
            else openSubmitModal();
        } else if (cx >= 235 && cx <= 370 && cy >= 250 && cy <= 290) {
            shareScorecard();
        } else if (cx >= 385 && cx <= 560 && cy >= 250 && cy <= 290) {
            shareImageCard();
        }
        return;
    }

    if (state === 'MODAL') {
        const mx = 40, my = 14, mw = 560, mh = 267;
        // Fechar no botão X ou fora da caixa
        if ((cx >= mx + mw - 35 && cx <= mx + mw && cy >= my && cy <= my + 35) ||
            (cx < mx || cx > mx + mw || cy < my || cy > my + mh)) {
            closeModal();
            return;
        }

        // Clicar numa Ação da Loja na Coluna Direita (ax: mx + 138, aw: mw - 152)
        if (modalBuilding && modalBuilding.currentActions) {
            const ax = mx + 138;
            const aw = mw - 152;
            const cardH = 48;
            const cardGap = 5;

            modalBuilding.currentActions.forEach((act, idx) => {
                const ay = my + 44 + idx * (cardH + cardGap);
                if (cx >= ax && cx <= ax + aw && cy >= ay && cy <= ay + cardH) {
                    executeAction(act);
                }
            });
        }
        return;
    }

    if (state === 'BOARD') {
        const hy = 295;
        // Clicar no botão Dormir (Slot 6: x de 568 a 634)
        if (cx >= 582 && cx <= 634 && cy >= hy + 8 && cy <= hy + 56) {
            triggerHaptic([40, 30, 40]);
            endDay("Terminaste o turno voluntariamente para descansar.");
            return;
        }

        // Clicar no Slot 4 de Emprego & Curso (x de 342 a 452) -> Caminha para o IST / Universidade
        if (cx >= 342 && cx <= 452 && cy >= hy + 8 && cy <= hy + 56) {
            triggerHaptic([25]);
            walkToBuilding(BUILDINGS.find(b => b.id === 'faculdade'));
            return;
        }

        // Clicar no Slot 5 de Vestuário & Desgaste (x de 456 a 526) -> Caminha para o Pingo Doce / Alfaiate
        if (cx >= 456 && cx <= 526 && cy >= hy + 8 && cy <= hy + 56) {
            triggerHaptic([25]);
            walkToBuilding(BUILDINGS.find(b => b.id === 'supermercado'));
            return;
        }

        // Easter Egg 1: Clicar no Elétrico 28 toca a sineta (Ding-Ding!)
        const tramX = ((animTimer * 38) % (canvas.width + 140)) - 70;
        if (cx >= tramX && cx <= tramX + 48 && cy >= 142 && cy <= 168) {
            sfxTramBell();
            triggerHaptic([30, 40, 30]);
            spawnParticle("🔔 Plim-Plim!", "#fde047", tramX + 24, 136);
            return;
        }

        // Easter Egg 2: Clicar no Cacilheiro toca o apito grave do barco (Fóóó-om!)
        const cacilheiroX = canvas.width - ((animTimer * 16) % (canvas.width + 120)) + 30;
        if (cx >= cacilheiroX && cx <= cacilheiroX + 52 && cy >= 268 && cy <= 295) {
            sfxCacilheiroHorn();
            triggerHaptic([80, 50, 100]);
            spawnParticle("🚢 Fóóó-om!", "#38bdf8", cacilheiroX + 26, 262);
            return;
        }

        // Easter Egg 3: Clicar nos Pombos do Rossio fá-los saltar assustados
        for (let i = 0; i < PIGEONS.length; i++) {
            const p = PIGEONS[i];
            if (Math.hypot(cx - p.x, cy - p.y) < 18) {
                p.scaredTimer = 0.9;
                p.x += (cx < p.x ? 18 : -18);
                sfxPigeon();
                triggerHaptic([20]);
                spawnDust(p.x, p.y + 4);
                spawnParticle("🕊️ Pruuu!", "#cbd5e1", p.x, p.y - 12);
                return;
            }
        }

        BUILDINGS.forEach(b => {
            if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
                triggerHaptic([20]);
                walkToBuilding(b);
            }
        });
    }
}

function walkToBuilding(b) {
    if (player.walking) return;
    sfxStep();
    player.targetX = b.doorX || (b.x + b.w / 2);
    // Portas superiores: y=125 na calçada alta do Rossio
    // Portas inferiores: y=248 no cais de pedra ribeirinho (o Tejo fica em y>=274, longe da água!)
    player.targetY = b.doorY || (b.y > 150 ? 248 : 125);
    player.walking = true;
    player.destinationBuilding = b;
    consumeTime(0, 15);
}

function openBuilding(b) {
    sfxAction();
    modalBuilding = b;
    state = 'MODAL';
}

function closeModal() {
    modalBuilding = null;
    state = 'BOARD';
}

function executeAction(act) {
    if (act.rentPaid) {
        showToast(`A renda já está em dia! Faltam ${player.daysUntilRent} dias.`);
        return;
    }

    if (act.cost !== undefined && player.wallet < act.cost) {
        sfxAlert();
        showToast("Dinheiro insuficiente na carteira!");
        return;
    }

    if (act.reqEcts !== undefined && player.ects < act.reqEcts) {
        sfxAlert();
        showToast(`Precisas de ${act.reqEcts} ECTS no Politec / IST (tens ${player.ects})!`);
        return;
    }

    if (act.reqShifts !== undefined && act.promoteCareer) {
        const shifts = (player.careerShifts && player.careerShifts[act.promoteCareer]) || 0;
        if (shifts < act.reqShifts) {
            sfxAlert();
            showToast(`Precisas de ${act.reqShifts} turnos no ${WORKPLACES[act.promoteCareer].name} (fizeste ${shifts})!`);
            return;
        }
    }

    sfxCoin();
    triggerHaptic([25]);

    if (act.cost !== undefined) {
        player.wallet -= act.cost;
        spawnParticle(`- ${act.cost}€`, '#ef4444');
    }
    if (act.gain !== undefined) {
        player.wallet += act.gain;
        stats.totalEarned += act.gain;
        spawnParticle(`+ ${act.gain}€`, '#10b981');
    }

    if (act.payRent) {
        stats.totalRentPaid += act.cost;
        player.daysUntilRent = 7;
        showToast("Renda semanal regularizada com sucesso! Recibo do Sr. Jerónimo.");
        spawnParticle("✓ Renda Paga!", '#10b981');
    }

    if (act.hunger !== undefined) {
        player.hunger = Math.min(100, player.hunger + act.hunger);
        spawnParticle("🍲 +Comida", '#f59e0b');
    }
    if (act.sanity !== undefined) {
        player.sanity = Math.min(100, player.sanity + act.sanity);
        spawnParticle("✨ +Sanidade", '#06b6d4');
    }
    if (act.ects !== undefined) {
        player.ects = Math.min(180, player.ects + act.ects);
        spawnParticle(`+${act.ects} ECTS`, '#38bdf8');
    }
    if (act.groceries !== undefined) {
        player.groceries += act.groceries;
        spawnParticle("🛒 Despensa", '#10b981');
    }

    // Matrícula em Curso no IST
    if (act.enrollCourse) {
        player.enrolledCourse = act.enrollCourse;
        const course = COURSES[act.enrollCourse];
        showToast(`Matrícula efetuada com sucesso em: ${course.name}!`);
        spawnParticle(`🎓 ${course.shortName}`, '#38bdf8');
    }

    // Estudo de Cadeiras / Exames no Curso Ativo
    if (act.studyCourse) {
        const cId = act.studyCourse;
        player.courseEcts[cId] = (player.courseEcts[cId] || 0) + act.ects;
        showToast(`Cadeira concluída com sucesso! +${act.ects} ECTS em ${COURSES[cId].shortName}.`);
        spawnParticle(`+${act.ects} ECTS`, '#38bdf8');
    }

    // Cancelar / Trocar de Curso
    if (act.resetCourse) {
        player.enrolledCourse = null;
        showToast("Matrícula reiniciada na secretaria do IST. Escolhe o teu novo curso!");
        spawnParticle("🔄 Novo Curso", '#38bdf8');
    }

    // Candidatura Formal a Emprego
    if (act.applyJob) {
        const wpKey = act.applyJob;
        const check = checkJobPrerequisites(wpKey, 0);
        if (!check.ok) {
            sfxAlert();
            showToast(check.reason);
            return;
        }
        player.currentWorkplace = wpKey;
        const firstJob = WORKPLACES[wpKey].careers[0];
        showToast(`Contratado oficialmente como ${firstJob.title} no ${WORKPLACES[wpKey].name}!`);
        spawnParticle(`💼 ${firstJob.title}`, '#10b981');
    }

    // Turno de Trabalho Rigoroso
    if (act.workShift) {
        const wpKey = act.workShift;
        const rank = (player.careerRanks && player.careerRanks[wpKey]) || 0;
        const check = checkJobPrerequisites(wpKey, rank);
        if (!check.ok) {
            sfxAlert();
            showToast(check.reason);
            return;
        }

        wearClothing(act.wear || (wpKey === 'tasca' || wpKey === 'pingo_doce' ? 8 : 5));
        player.careerShifts[wpKey] = (player.careerShifts[wpKey] || 0) + 1;
        player.totalShiftsWorked = (player.totalShiftsWorked || 0) + 1;

        if (act.mealHunger) {
            player.hunger = Math.min(100, player.hunger + act.mealHunger);
            spawnParticle(`🍲 +${act.mealHunger} Comida`, '#10b981');
        }
        if (act.ectsBonus) {
            player.courseEcts.matematica = (player.courseEcts.matematica || 0) + act.ectsBonus;
            player.ects = Math.min(180, player.ects + act.ectsBonus);
            spawnParticle(`+${act.ectsBonus} ECTS`, '#38bdf8');
        }
        showToast(`Turno concluído no ${WORKPLACES[wpKey].name}! (+${act.gain}€)`);
    }

    // Promoção de Carreira
    if (act.promoteCareer) {
        const wpKey = act.promoteCareer;
        const currentRank = (player.careerRanks && player.careerRanks[wpKey]) || 0;
        const targetRank = currentRank + 1;
        const check = checkJobPrerequisites(wpKey, targetRank);
        if (!check.ok) {
            sfxAlert();
            showToast(check.reason);
            return;
        }
        player.careerRanks[wpKey] = targetRank;
        const newJob = WORKPLACES[wpKey].careers[targetRank];
        showToast(`⭐ Promovido a ${newJob.title} no ${WORKPLACES[wpKey].name}!`);
        spawnParticle("⭐ Promoção!", '#10b981');
    }

    // Compra de Vestuário
    if (act.buyClothing) {
        const tier = CLOTHING_TIERS[act.buyClothing];
        player.clothing = {
            id: tier.id,
            name: tier.name,
            icon: tier.icon,
            formality: tier.formality,
            durability: tier.maxDurability
        };
        showToast(`Compraste ${tier.name}! Vestuário pronto a usar.`);
        spawnParticle(`👕 ${tier.name}`, '#10b981');
    }

    // Remendar Roupa
    if (act.repairClothing) {
        if (!player.clothing || player.clothing.id === 'nude' || player.clothing.durability <= 0) {
            sfxAlert();
            showToast("Não podes remendar o ar! Estás nu, compra roupa nova.");
            return;
        }
        const maxDur = CLOTHING_TIERS[player.clothing.id].maxDurability || 60;
        player.clothing.durability = Math.min(maxDur, player.clothing.durability + 40);
        showToast(`Roupa remendada com linha e agulha! Durabilidade: ${player.clothing.durability}%`);
        spawnParticle("✂️ Remendado!", '#10b981');
    }

    if (act.cycleWorkplace) {
        const keys = ['pingo_doce', 'tasca', 'banco', 'startup'];
        const idx = keys.indexOf(player.currentWorkplace);
        const nextKey = keys[(idx + 1) % keys.length];
        player.currentWorkplace = nextKey;
        const job = getPlayerJob(nextKey);
        showToast(`Contrato ativo alterado para: ${WORKPLACES[nextKey].name} (${job.title})!`);
        spawnParticle(`💼 ${WORKPLACES[nextKey].shortName}`, '#38bdf8');
    }

    if (act.reviewCv) {
        showToast(`CV Analisado: ${getCurriculumDegree()} · ${player.totalShiftsWorked || 0} turnos totais realizados.`);
        spawnParticle("📄 CV Atualizado", '#38bdf8');
    }

    if (act.deposit !== undefined) {
        if (player.wallet >= act.deposit) {
            player.wallet -= act.deposit;
            player.bank += act.deposit;
            spawnParticle(`🏦 Depósito 50€`, '#38bdf8');
        } else {
            showToast("Não tens 50€ na carteira!");
            return;
        }
    }
    if (act.withdraw !== undefined) {
        if (player.bank >= act.withdraw) {
            player.bank -= act.withdraw;
            player.wallet += act.withdraw;
            spawnParticle(`💵 Levantado 50€`, '#10b981');
        } else {
            showToast("Saldo bancário insuficiente!");
            return;
        }
    }

    if (act.eatHome) {
        if (player.groceries > 0) {
            player.groceries--;
            player.hunger = Math.min(100, player.hunger + 45);
            showToast("Comeste uma refeição da despensa de casa!");
            spawnParticle("🍲 +45 Comida", '#10b981');
        } else {
            sfxAlert();
            showToast("A despensa está vazia! Compra mercearias no Pingo Doce.");
            return;
        }
    }

    if (act.sleepNight) {
        closeModal();
        endDay(player.houseIndex === 0 ? "Passaste a noite no banco de jardim do Rossio." : "Dormiste na tua casa.");
        return;
    }

    if (act.upgradeHouse) {
        stats.totalRentPaid += act.cost;
        player.houseIndex = Math.min(HOUSES.length - 1, player.houseIndex + 1);
        player.daysUntilRent = 7;
        showToast(`Mudaste-te para: ${HOUSES[player.houseIndex].name}! Contrato de 7 dias.`);
        spawnParticle("🏠 Nova Casa!", '#f59e0b');
    }

    consumeTime(act.timeH || 0, act.timeM || 0);
}

function getMordantRoast() {
    if (player.hungerDays >= 3) {
        return "Faleceu por insistir que a massa com atum supria todas as necessidades biológicas da pirâmide dos alimentos. O saldo bancário não aguentou uma tosta mista no snack-bar da esquina.";
    }
    if (player.sanity <= 0) {
        return "Entrou em combustão espontânea após ver uma cave húmida em Marvila anunciada como 'Studio Minimalista com Luz Indireta' por 1350€ sem fiador.";
    }
    if (player.houseIndex === 0) {
        return "Despejado às 07:00 da manhã para o beliche dar lugar a dois nómadas digitais alemães de sandálias e meias que pagam o triplo em criptomoeda.";
    }
    if (player.day >= 30) {
        return "Milagre de Fátima! Sobreviveu 30 dias na labuta e comprou um T1 pombalino no Chiado. O senhorio agora pede-lhe a bênção antes de aumentar as rendas aos outros.";
    }
    return "Vencido pela inflação da bica, pela precariedade contratual e pela teimosia em recusar emigrar para a Suíça.";
}

function getPrecarityRank(days) {
    if (days < 5) return "TURISTA DESAVISADO (Nem o passe soube tirar)";
    if (days < 12) return "ESTAGIÁRIO PRECÁRIO (Viciado em massa com atum)";
    if (days < 20) return "SOBREVIVENTE DA CALÇADA (Dorme ao som de tuk-tuks)";
    if (days < 30) return "GUERREIRO DO RENDIMENTO (Candidato a herdeiro)";
    return "D. SEBASTIÃO DO IMOBILIÁRIO (Bateu o mercado e o senhorio!)";
}

function drawHazardTape(ctx, x, y, w, h, text) {
    ctx.fillStyle = '#eab308';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#000000';
    const stripeW = 24;
    for (let sx = x; sx < x + w + h; sx += stripeW * 2) {
        ctx.beginPath();
        ctx.moveTo(sx, y);
        ctx.lineTo(sx - h, y + h);
        ctx.lineTo(sx - h + stripeW, y + h);
        ctx.lineTo(sx + stripeW, y);
        ctx.closePath();
        ctx.fill();
    }
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
    ctx.fillRect(x + w / 2 - 300, y + 4, 600, h - 8);
    ctx.fillStyle = '#eab308';
    ctx.font = 'bold 20px "Fira Code", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(text, x + w / 2, y + h / 2 + 7);
}

function drawStoryPixelAvatar(sctx, px, py, scale) {
    sctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    sctx.beginPath();
    sctx.ellipse(px, py + 14 * scale, 8 * scale, 4 * scale, 0, 0, Math.PI * 2);
    sctx.fill();

    sctx.fillStyle = '#1e293b';
    sctx.fillRect(px - 5 * scale, py + 4 * scale, 4 * scale, 8 * scale);
    sctx.fillRect(px + 1 * scale, py + 4 * scale, 4 * scale, 8 * scale);

    sctx.fillStyle = '#0284c7';
    sctx.fillRect(px - 7 * scale, py - 6 * scale, 14 * scale, 11 * scale);

    sctx.fillStyle = '#fbcfe8';
    sctx.fillRect(px - 5 * scale, py - 16 * scale, 10 * scale, 10 * scale);

    sctx.fillStyle = '#1c1917';
    sctx.fillRect(px - 6 * scale, py - 18 * scale, 12 * scale, 4 * scale);

    sctx.fillStyle = '#292524';
    sctx.fillRect(px - 5 * scale, py - 10 * scale, 10 * scale, 4 * scale);

    sctx.fillStyle = '#0f172a';
    sctx.fillRect(px - 5 * scale, py - 14 * scale, 4 * scale, 3 * scale);
    sctx.fillRect(px + 1 * scale, py - 14 * scale, 4 * scale, 3 * scale);

    // Olhos com X vermelhos (mordaz - morreu no jogo)
    sctx.fillStyle = '#ef4444';
    sctx.fillRect(px - 4 * scale, py - 13 * scale, 2 * scale, 2 * scale);
    sctx.fillRect(px + 2 * scale, py - 13 * scale, 2 * scale, 2 * scale);
}

function generateStoryCanvas() {
    const sc = document.createElement('canvas');
    sc.width = 1080;
    sc.height = 1920;
    const sctx = sc.getContext('2d');
    sctx.imageSmoothingEnabled = false;

    // Fundo Obsidian
    sctx.fillStyle = '#0b0e14';
    sctx.fillRect(0, 0, sc.width, sc.height);

    // Grelha de calçada
    sctx.fillStyle = '#172033';
    for (let py = 0; py < sc.height; py += 32) {
        for (let px = 0; px < sc.width; px += 32) {
            if ((Math.floor(px / 32) + Math.floor(py / 32)) % 3 === 0) {
                sctx.fillRect(px, py, 10, 10);
            }
        }
    }

    const rad = sctx.createRadialGradient(sc.width / 2, 700, 200, sc.width / 2, 700, 950);
    rad.addColorStop(0, 'rgba(239, 68, 68, 0.22)');
    rad.addColorStop(0.6, 'rgba(11, 14, 20, 0.7)');
    rad.addColorStop(1, '#05070a');
    sctx.fillStyle = rad;
    sctx.fillRect(0, 0, sc.width, sc.height);

    // Fitas de Perigo
    drawHazardTape(sctx, 0, 60, sc.width, 42, "⚠️ REPÚBLICA PRECÁRIA DE LISBOA ⚠️");
    drawHazardTape(sctx, 0, sc.height - 102, sc.width, 42, "⚠️ DESENRASCADO · O PURGATÓRIO ⚠️");

    // Moldura Âmbar
    sctx.strokeStyle = '#f59e0b';
    sctx.lineWidth = 6;
    sctx.strokeRect(60, 130, sc.width - 120, sc.height - 260);

    sctx.strokeStyle = '#233148';
    sctx.lineWidth = 2;
    sctx.strokeRect(74, 144, sc.width - 148, sc.height - 288);

    // Cabeçalho Oficial
    sctx.fillStyle = '#ef4444';
    sctx.font = 'bold 48px "Fira Code", monospace';
    sctx.textAlign = 'center';
    sctx.fillText("CERTIDÃO DE ÓBITO / DESPEJO", sc.width / 2, 225);

    sctx.fillStyle = '#38bdf8';
    sctx.font = 'bold 20px "Fira Code", monospace';
    sctx.fillText("DIRECÇÃO-GERAL DA PRECARIEDADE & HABITAÇÃO IMPOSSÍVEL", sc.width / 2, 270);

    // Carimbo Vermelho em Ângulo Rotativo
    sctx.save();
    sctx.translate(sc.width - 240, 310);
    sctx.rotate(-15 * Math.PI / 180);
    sctx.strokeStyle = '#ef4444';
    sctx.lineWidth = 6;
    sctx.strokeRect(-160, -40, 320, 80);
    sctx.fillStyle = 'rgba(239, 68, 68, 0.88)';
    sctx.font = '900 28px "Fira Code", monospace';
    sctx.textAlign = 'center';
    sctx.fillText("DESPEJADO", 0, -5);
    sctx.font = '16px "Fira Code", monospace';
    sctx.fillText("HOMOLOGADO PELO SENHORIO", 0, 22);
    sctx.restore();

    // Foto Pixel Art (10x Zoom)
    const photoX = 110;
    const photoY = 320;
    const photoW = 280;
    const photoH = 340;

    sctx.fillStyle = '#1e293b';
    sctx.fillRect(photoX, photoY, photoW, photoH);
    sctx.strokeStyle = '#ef4444';
    sctx.lineWidth = 4;
    sctx.strokeRect(photoX, photoY, photoW, photoH);

    drawStoryPixelAvatar(sctx, photoX + photoW / 2, photoY + photoH / 2 - 20, 10);

    sctx.fillStyle = '#f59e0b';
    sctx.font = 'bold 18px "Fira Code", monospace';
    sctx.textAlign = 'center';
    sctx.fillText("CIDADÃO PRECÁRIO", photoX + photoW / 2, photoY + photoH - 24);

    // Dados Forenses do Cidadão
    const infoX = 430;
    const infoY = 340;

    sctx.textAlign = 'left';
    const curStoryJob = getPlayerJob();
    const curStoryWp = WORKPLACES[player.currentWorkplace] || WORKPLACES.pingo_doce;
    const infoRows = [
        ["TEMPO SOBREVIVIDO:", `${stats.daysSurvived} DIAS`],
        ["ÚLTIMO ABRIGO:", HOUSES[player.houseIndex].name],
        ["OCUPAÇÃO:", `${curStoryJob.title} (${curStoryWp.shortName})`],
        ["ECTS ACUMULADOS:", `${player.ects} / 180`],
        ["RENDA TOTAL DOADA:", `${stats.totalRentPaid} €`],
        ["SALDO RESTANTE:", `${player.wallet + player.bank} €`],
        ["DIETA BASE:", "88% Atum · 12% Bica"]
    ];

    infoRows.forEach(([lbl, val], idx) => {
        const ry = infoY + idx * 46;
        sctx.fillStyle = '#94a3b8';
        sctx.font = 'bold 18px "Fira Code", monospace';
        sctx.fillText(lbl, infoX, ry);

        sctx.fillStyle = '#ffffff';
        sctx.font = '22px "Fira Code", monospace';
        sctx.fillText(val, infoX + 260, ry);
    });

    // Caixa de Diagnóstico Mordaz
    const roastBoxY = 700;
    sctx.fillStyle = '#131b2e';
    sctx.strokeStyle = '#38bdf8';
    sctx.lineWidth = 3;
    sctx.fillRect(110, roastBoxY, sc.width - 220, 310);
    sctx.strokeRect(110, roastBoxY, sc.width - 220, 310);

    sctx.fillStyle = '#38bdf8';
    sctx.font = 'bold 24px "Fira Code", monospace';
    sctx.textAlign = 'left';
    sctx.fillText("📋 RELATÓRIO FORENSE / AUTO DA MORTE:", 140, roastBoxY + 50);

    const roastText = getMordantRoast();
    wrapTextCanvas(sctx, roastText, 140, roastBoxY + 105, sc.width - 280, 38, '24px "Fira Code", monospace', '#f8fafc');

    // Nível de Precariedade
    const rankY = 1060;
    sctx.fillStyle = '#182234';
    sctx.strokeStyle = '#f59e0b';
    sctx.lineWidth = 3;
    sctx.fillRect(110, rankY, sc.width - 220, 160);
    sctx.strokeRect(110, rankY, sc.width - 220, 160);

    sctx.fillStyle = '#f59e0b';
    sctx.font = 'bold 20px "Fira Code", monospace';
    sctx.fillText("🏆 ESCALÃO OFICIAL DE PRECARIEDADE:", 140, rankY + 45);

    const rankText = getPrecarityRank(stats.daysSurvived);
    sctx.fillStyle = '#10b981';
    sctx.font = 'bold 26px "Fira Code", monospace';
    sctx.fillText(rankText, 140, rankY + 95);

    // Call to Action Inferior
    const ctaY = 1290;
    sctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
    sctx.strokeStyle = '#ef4444';
    sctx.lineWidth = 2;
    sctx.fillRect(110, ctaY, sc.width - 220, 180);
    sctx.strokeRect(110, ctaY, sc.width - 220, 180);

    sctx.fillStyle = '#ffffff';
    sctx.font = 'bold 28px "Fira Code", monospace';
    sctx.textAlign = 'center';
    sctx.fillText("ACHAS QUE AGUENTAS MAIS TEMPO EM LISBOA?", sc.width / 2, ctaY + 55);

    sctx.fillStyle = '#f59e0b';
    sctx.font = 'bold 36px "Fira Code", monospace';
    sctx.fillText("desenrascado.pormenores.net", sc.width / 2, ctaY + 110);

    sctx.fillStyle = '#94a3b8';
    sctx.font = '20px "Fira Code", monospace';
    sctx.fillText("Joga grátis no browser · Sem instalações nem tretas", sc.width / 2, ctaY + 148);

    // Assinatura Final no Rodapé
    sctx.fillStyle = '#64748b';
    sctx.font = '20px "Fira Code", monospace';
    sctx.fillText("pormenores.net", sc.width / 2, sc.height - 135);

    return sc;
}

function shareImageCard() {
    showToast("A gerar Certidão Oficial de Despejo...");

        const sc = generateStoryCanvas();
        sc.toBlob(async (blob) => {
            const file = new File([blob], `desenrascado-obito-dia-${stats.daysSurvived}.png`, { type: 'image/png' });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {

                    });
                    showToast("Partilhado com sucesso!");
                    return;
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        console.log("Fallback download:", e);
                    }
                }
            }

            const a = document.createElement('a');
            a.download = `desenrascado-obito-dia-${stats.daysSurvived}.png`;
            a.href = sc.toDataURL('image/png');
            a.click();
            showToast("📸 Imagem descarregada! Pronta para o Instagram Stories!");
        }, 'image/png');
    }, 100);
}

// ============================================================================
// 9. LEADERBOARD (HALL OF FAME) & API
// ============================================================================
let isScoreSubmitted = false;

function openLeaderboard() {
    const modal = document.getElementById('leaderboard-modal');
    if (!modal) return;
    modal.style.display = 'flex';
    fetchLeaderboard();
}

function closeLeaderboard() {
    const modal = document.getElementById('leaderboard-modal');
    if (modal) modal.style.display = 'none';
}

function openSubmitModal() {
    if (isScoreSubmitted) {
        openLeaderboard();
        return;
    }
    const modal = document.getElementById('submit-score-modal');
    if (!modal) return;
    document.getElementById('sub-days-text').textContent = stats.daysSurvived;
    document.getElementById('sub-money-text').textContent = `${player.wallet + player.bank}€`;
    modal.style.display = 'flex';
    setTimeout(() => {
        const input = document.getElementById('player-nickname');
        if (input) input.focus();
    }, 100);
}

function closeSubmitModal() {
    const modal = document.getElementById('submit-score-modal');
    if (modal) modal.style.display = 'none';
}

async function fetchLeaderboard() {
    const tbody = document.getElementById('lb-table-body');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px; color: #94a3b8;">A carregar recordes de Lisboa...</td></tr>';

    try {
        const res = await fetch('/api/leaderboard.php');
        const data = await res.json();
        if (data.status === 'ok' && Array.isArray(data.scores)) {
            renderLeaderboardRows(data.scores);
        } else {
            throw new Error();
        }
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px; color: #ef4444;">Não foi possível carregar a tabela de recordes.</td></tr>';
    }
}

function renderLeaderboardRows(scores) {
    const tbody = document.getElementById('lb-table-body');
    if (!tbody) return;
    if (scores.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px; color: #94a3b8;">Nenhum recorde registado ainda. Sê o primeiro!</td></tr>';
        return;
    }

    tbody.innerHTML = scores.map((s, idx) => {
        const rank = idx + 1;
        let rankClass = '';
        let medal = `#${rank}`;
        if (rank === 1) { rankClass = 'rank-gold'; medal = '🥇 #1'; }
        else if (rank === 2) { rankClass = 'rank-silver'; medal = '🥈 #2'; }
        else if (rank === 3) { rankClass = 'rank-bronze'; medal = '🥉 #3'; }

        return `
            <tr>
                <td class="${rankClass}">${medal}</td>
                <td style="font-weight:700;">${escapeHtml(s.name)}</td>
                <td style="color:#f59e0b; font-weight:700;">${s.days}d</td>
                <td style="color:#10b981;">${s.money}€</td>
                <td style="color:#94a3b8; font-size:0.65rem;">${escapeHtml(s.cause || 'Despejado')}</td>
                <td style="color:#64748b; font-size:0.65rem;">${s.date || ''}</td>
            </tr>
        `;
    }).join('');
}

async function submitPlayerScore() {
    const input = document.getElementById('player-nickname');
    const name = input ? input.value.trim() : '';
    const btn = document.getElementById('btn-confirm-submit');

    if (!name) {
        showToast("Por favor digita a tua alcunha!");
        if (input) input.focus();
        return;
    }

    if (btn) {
        btn.disabled = true;
        btn.textContent = "A GRAVAR...";
    }

    try {
        const payload = {
            name: name,
            days: stats.daysSurvived,
            money: player.wallet + player.bank,
            cause: player.deathTitle || 'Sobreviveu à Renda'
        };

        const res = await fetch('/api/leaderboard.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.status === 'ok') {
            isScoreSubmitted = true;
            closeSubmitModal();
            showToast(`🏆 Recorde gravado com sucesso! Ficaste em #${data.rank}`);
            openLeaderboard();
            if (data.scores) {
                renderLeaderboardRows(data.scores);
            }
        } else {
            showToast(data.message || "Erro ao gravar recorde.");
            if (btn) {
                btn.disabled = false;
                btn.textContent = "GRAVAR NO HALL OF FAME ➔";
            }
        }
    } catch (e) {
        showToast("Erro de ligação ao servidor.");
        if (btn) {
            btn.disabled = false;
            btn.textContent = "GRAVAR NO HALL OF FAME ➔";
        }
    }
}

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
}

requestAnimationFrame(gameLoop);
</script>
