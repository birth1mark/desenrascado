<script>
/**
 * DESENRASCADO — O Purgatório de Lisboa (Retro Board Edition)
 * Jogo de Tabuleiro e Sobrevivência Urbana em Lisboa
 * Arquitetura: Pure Canvas 2D + State Machine + Web Audio Chiptune
 * Autor: Pedro Ribeiro (birth1mark) · pormenores.net
 */

// ============================================================================
// 1. ÁUDIO CHIPTUNE SINTETIZADO (Web Audio API)
// ============================================================================
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
    if (!audioCtx) {
        const AudioContextClass = (typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext)) || (typeof AudioContext !== 'undefined' ? AudioContext : null);
        if (!AudioContextClass) return;
        try {
            audioCtx = new AudioContextClass();
        } catch(e) {
            audioCtx = null;
        }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch(e) {}
    }
}

function toggleAudio() {
    initAudio();
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('btn-audio');
    if (btn) btn.textContent = soundEnabled ? '🔊 Áudio: ON' : '🔇 Áudio: OFF';
}

function playBeep(freq, type, duration, vol = 0.1) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}


// ============================================================================
// NOVO SISTEMA DE PARTÍCULAS DE POEIRA & EFEITOS SONOROS DE LISBOA
// ============================================================================
let dustParticles = [];

function spawnDust(x, y) {
    if (dustParticles.length > 30) dustParticles.shift();
    dustParticles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 0.9,
        vy: -0.3 - Math.random() * 0.5,
        size: 1.5 + Math.random() * 2,
        alpha: 0.65
    });
}

function updateDust(dt) {
    for (let i = dustParticles.length - 1; i >= 0; i--) {
        const d = dustParticles[i];
        d.x += d.vx;
        d.y += d.vy;
        d.alpha -= dt * 1.6;
        if (d.alpha <= 0) dustParticles.splice(i, 1);
    }
}

function renderDust() {
    dustParticles.forEach(d => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, d.alpha);
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

// Sineta Clássica do Elétrico 28 (Ding-Ding!)
function sfxTramBell() {
    if (!soundEnabled) return;
    initAudio();
    playBeep(880, 'triangle', 0.08, 0.12);
    setTimeout(() => playBeep(1174.66, 'triangle', 0.14, 0.14), 70);
    setTimeout(() => playBeep(880, 'triangle', 0.08, 0.09), 160);
    setTimeout(() => playBeep(1174.66, 'triangle', 0.15, 0.12), 230);
}

// Apito Grave do Cacilheiro da Transtejo (Fóóó-om!)
function sfxCacilheiroHorn() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(104, audioCtx.currentTime + 0.65);
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.7);
    } catch(e){}
}

// Pombos a esvoaçar
function sfxPigeon() {
    if (!soundEnabled) return;
    initAudio();
    playBeep(640, 'sine', 0.04, 0.05);
    setTimeout(() => playBeep(520, 'sine', 0.06, 0.05), 45);
}

// Vibração Táctil no Telemóvel (Haptic Feedback)
function triggerHaptic(pattern = [25]) {
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch(e){}
    }
}

// Roupa Estendida nas Fachadas a Baloiçar ao Vento
function drawClothesline(x, y, w) {
    const sway = Math.sin(animTimer * 3.6 + x) * 2.5;
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + w / 2, y + 3 + sway * 0.4, x + w, y);
    ctx.stroke();

    const items = [
        { dx: w * 0.18, color: '#fef08a', iw: 7, ih: 8 },  // T-shirt amarela
        { dx: w * 0.48, color: '#38bdf8', iw: 9, ih: 10 }, // Toalha azul
        { dx: w * 0.78, color: '#ef4444', iw: 5, ih: 7 }   // Meia encarnada
    ];

    items.forEach(it => {
        const ix = x + it.dx;
        const iy = y + 2 + sway * 0.4;
        ctx.fillStyle = it.color;
        ctx.fillRect(ix, iy, it.iw, it.ih);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(ix + 1, iy - 1, 2, 2);
    });
}

function sfxCoin() {

function sfxStep() {

}

function sfxAction() {

function sfxAlert() {

function sfxWin() {
    const notes = [523.25, 659.25, 783.99, 1046.50];

// ============================================================================
// 1.1 MÚSICA CHIPTUNE PROCEDURAL (Web Audio API)
// ============================================================================
let musicEnabled = true;
let musicInterval = null;
let musicStep = 0;

const BGM_NOTES = {
    C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99
};

const BGM_TRACK = [
    { lead: BGM_NOTES.C4, bass: BGM_NOTES.C3 },
    { lead: BGM_NOTES.E4, bass: null },
    { lead: BGM_NOTES.G4, bass: BGM_NOTES.G3 },
    { lead: BGM_NOTES.C5, bass: null },
    { lead: BGM_NOTES.A4, bass: BGM_NOTES.F3 },
    { lead: BGM_NOTES.G4, bass: null },
    { lead: BGM_NOTES.E4, bass: BGM_NOTES.C3 },
    { lead: BGM_NOTES.D4, bass: null },
    { lead: BGM_NOTES.E4, bass: BGM_NOTES.A3 },
    { lead: BGM_NOTES.G4, bass: null },
    { lead: BGM_NOTES.A4, bass: BGM_NOTES.D3 },
    { lead: BGM_NOTES.G4, bass: null },
    { lead: BGM_NOTES.E4, bass: BGM_NOTES.G3 },
    { lead: BGM_NOTES.D4, bass: null },
    { lead: BGM_NOTES.C4, bass: BGM_NOTES.C3 },
    { lead: null,           bass: null }
];

function startBGM() {
    if (musicInterval || !musicEnabled) return;
    initAudio();
    musicStep = 0;
    musicInterval = setInterval(() => {
        if (!musicEnabled || !audioCtx || audioCtx.state !== 'running') return;
        if (state !== 'BOARD' && state !== 'MODAL') return;

        const note = BGM_TRACK[musicStep];
        const now = audioCtx.currentTime;

        // Lead synth (square wave, filtrado e suave)
        if (note.lead) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(note.lead, now);
                gain.gain.setValueAtTime(0.018, now);
                gain.gain.exponentialRampToValueAtTime(0.0005, now + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } catch(e) {}
        }

        // Bass synth (triangle wave)
        if (note.bass) {
            try {
                const bOsc = audioCtx.createOscillator();
                const bGain = audioCtx.createGain();
                bOsc.type = 'triangle';
                bOsc.frequency.setValueAtTime(note.bass, now);
                bGain.gain.setValueAtTime(0.035, now);
                bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                bOsc.connect(bGain);
                bGain.connect(audioCtx.destination);
                bOsc.start(now);
                bOsc.stop(now + 0.18);
            } catch(e) {}
        }

        musicStep = (musicStep + 1) % BGM_TRACK.length;
    }, 145);
}

function stopBGM() {
    if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
    }
}

function toggleMusic() {
    initAudio();
    musicEnabled = !musicEnabled;

function checkJobPrerequisites(wpKey, rank) {
    const wp = WORKPLACES[wpKey];
    if (!wp) return { ok: false, reason: "Local desconhecido." };
    const job = wp.careers[rank];
    if (!job) return { ok: false, reason: "Cargo inexistente." };

    // 1. Verificação de Nudez
    if (!player.clothing || player.clothing.id === 'nude' || player.clothing.durability <= 0) {
        return { ok: false, reason: "Estás completamente nu! Veste roupa antes de trabalhar ou candidatar-te!" };
    }

    // 2. Verificação de Formalidade de Roupa ("Não posso ser gerente de calções e sapatilhas!")
    const curFormality = CLOTHING_TIERS[player.clothing.id].formality;
    if (curFormality < job.minFormality) {
        if (job.minFormality >= 3) {
            return { ok: false, reason: `Exige Fato Pombalino Completo! Não podes ser ${job.title} de calções e sapatilhas. Compra um fato no alfaiate!` };
        } else if (job.minFormality >= 2) {
            return { ok: false, reason: `Exige pelo menos Smart Casual (polo limpo e calças)! Não podes trabalhar de calções rasgados.` };
        }
    }

    // 3. Verificação de Curso Universitário Específico
    if (job.reqCourse) {
        if (player.enrolledCourse !== job.reqCourse) {
            const reqCourseName = COURSES[job.reqCourse].name;
            if (wpKey === 'faculdade' && rank === 0) {
                return { ok: false, reason: "Monitor de álgebra sem curso de Matemática é fodido! Matricula-te em Matemática Aplicada no IST." };
            }
            return { ok: false, reason: `Exige matrícula no curso de ${reqCourseName} no IST!` };
        }
        const courseEcts = (player.courseEcts && player.courseEcts[job.reqCourse]) || 0;
        if (courseEcts < job.minCourseEcts) {
            return { ok: false, reason: `Precisas de pelo menos ${job.minCourseEcts} ECTS no curso de ${COURSES[job.reqCourse].shortName} (tens ${courseEcts} ECTS)!` };
        }
    }

    // 4. ECTS Gerais (caso aplicável)
    if (job.minTotalEcts && player.ects < job.minTotalEcts) {
        return { ok: false, reason: `Precisas de pelo menos ${job.minTotalEcts} ECTS universitários (tens ${player.ects})!` };
    }

    // 5. Turnos de Experiência do Cargo
    const shifts = (player.careerShifts && player.careerShifts[wpKey]) || 0;
    if (job.reqShifts && shifts < job.reqShifts) {
        return { ok: false, reason: `Precisas de ${job.reqShifts} turnos de experiência no ${wp.name} (tens ${shifts})!` };
    }

    return { ok: true };
}

function wearClothing(amount) {
    if (!player.clothing || player.clothing.id === 'nude') return;
    player.clothing.durability = Math.max(0, player.clothing.durability - amount);
    if (player.clothing.durability <= 0) {
        player.clothing.id = 'nude';
        player.clothing.name = 'Completamente Nu (Censurado)';
        player.clothing.icon = '🔞';
        player.clothing.formality = 0;

        spawnParticle("🔞 NU!", '#ef4444');

}

function getPlayerJob(workplaceKey = player.currentWorkplace) {
    if (!workplaceKey || !WORKPLACES[workplaceKey]) {
        return {

            hoursPerShift: 0,
            desc: "Sem emprego ativo. Visita a Agência de Emprego, Pingo Doce, Tasca ou Caixa para começar a trabalhar!"

    }
    const wp = WORKPLACES[workplaceKey];
    const rank = (player.careerRanks && player.careerRanks[workplaceKey]) || 0;
    return wp.careers[Math.min(wp.careers.length - 1, rank)];
}

function getNextJob(workplaceKey = player.currentWorkplace) {
    if (!workplaceKey || !WORKPLACES[workplaceKey]) {
        return null;
    }
    const wp = WORKPLACES[workplaceKey];
    const rank = (player.careerRanks && player.careerRanks[workplaceKey]) || 0;
    if (rank >= wp.careers.length - 1) return null;
    return wp.careers[rank + 1];
}

function matchEventConditions(ev, p) {
    const c = ev.conditions || {};
    if (c.workplace) {
        const curWp = p.currentWorkplace || 'unemployed';
        if (!c.workplace.includes('any') && !c.workplace.includes(curWp)) {
            return false;
        }
    }
    if (c.minHouseIndex !== undefined && p.houseIndex < c.minHouseIndex) return false;
    if (c.maxHouseIndex !== undefined && p.houseIndex > c.maxHouseIndex) return false;
    if (c.minWallet !== undefined && p.wallet < c.minWallet) return false;
    if (c.maxWallet !== undefined && p.wallet > c.maxWallet) return false;
    if (c.minSanity !== undefined && p.sanity < c.minSanity) return false;
    if (c.maxSanity !== undefined && p.sanity > c.maxSanity) return false;
    if (c.minEcts !== undefined && p.ects < c.minEcts) return false;
    if (c.maxDaysUntilRent !== undefined && p.daysUntilRent > c.maxDaysUntilRent) return false;
    return true;
}

function generateMorningEvent(p) {
    // Se a base de dados JSON estiver disponível, usa a matriz de seleção ponderada
    if (newspaperDb && newspaperDb.length > 0) {
        const matched = newspaperDb.filter(e => matchEventConditions(e, p));
        if (matched.length > 0) {
            const totalWeight = matched.reduce((s, e) => s + (e.weight || 10), 0);
            let rand = Math.random() * totalWeight;
            let chosen = matched[0];
            for (const ev of matched) {
                rand -= (ev.weight || 10);
                if (rand <= 0) { chosen = ev; break; }
            }
            return {
                title: chosen.title,
                desc: chosen.desc,
                effect: (player) => {
                    const eff = chosen.effect || {};
                    if (eff.wallet) {
                        player.wallet = Math.max(0, player.wallet + eff.wallet);
                        if (eff.wallet > 0) stats.totalEarned += eff.wallet;

                    if (eff.sanity) player.sanity = Math.max(0, Math.min(100, player.sanity + eff.sanity));

const calcadaCanvas = document.createElement('canvas');
calcadaCanvas.width = 640;
calcadaCanvas.height = 280;
const cctx = calcadaCanvas.getContext('2d');

function preRenderCalcada() {
    // 1. Base Calcário Creme/Marfim
    cctx.fillStyle = '#f1ebe0';
    cctx.fillRect(0, 0, 640, 280);

    // 2. Textura de pedras individuais
    cctx.fillStyle = '#e4dccf';
    for (let y = 0; y < 280; y += 8) {
        for (let x = 0; x < 640; x += 8) {
            if ((x + y) % 16 === 0) {
                cctx.fillRect(x + 1, y + 1, 6, 6);
            }
        }
    }

    // 3. Ondas Clássicas de Basalto Negro (Padrão 'Mar Largo' do Rossio)
    const basaltoCor = '#242b35';
    for (let y = 4; y < 280; y += 22) {
        for (let x = 0; x < 640; x += 3) {
            const wave = Math.sin((x + y * 1.8) * 0.07) * 7.5;
            const py = y + wave;
            if (py >= 0 && py < 276) {
                cctx.fillStyle = basaltoCor;
                cctx.fillRect(x, Math.round(py), 3, 4);
                // Pedra com relevo
                cctx.fillStyle = '#181d24';
                cctx.fillRect(x + 1, Math.round(py) + 1, 2, 2);
            }
        }
    }

    // 4. Guia / Lancil da Calçada junto ao Tejo
    cctx.fillStyle = '#cbd5e1';
    cctx.fillRect(0, 274, 640, 6);
    cctx.fillStyle = '#94a3b8';
    cctx.fillRect(0, 278, 640, 2);
}
preRenderCalcada();

// ============================================================================
// 5. ATUALIZAÇÃO DA LÓGICA (UPDATE)
// ============================================================================
let lastTime = performance.now();
let animTimer = 0;

function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    animTimer += dt;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    // Animação dos Pombos
    PIGEONS.forEach(p => {
        if (p.scaredTimer > 0) {
            p.scaredTimer -= dt * 2.5;
            p.frame = (Math.floor(animTimer * 18) % 2);
        } else {
            p.timer += dt;
            if (p.timer > 2.5) {
                p.frame = (p.frame + 1) % 2;
                p.timer = 0;
                if (Math.random() < 0.3) {
                    p.x += (Math.random() - 0.5) * 8;
                }
            }
            // Susto por proximidade do jogador ao caminhar
            if (Math.hypot(player.x - p.x, player.y - p.y) < 20 && player.walking) {
                p.scaredTimer = 0.8;
                sfxPigeon();
                spawnDust(p.x, p.y + 4);
            }
        }
    });

    // Partículas flutuantes e poeira
    updateDust(dt);
    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.y += pt.vy;
        pt.alpha -= dt * 0.9;
        if (pt.alpha <= 0) particles.splice(i, 1);
    }

    // Movimento do Peão
    if (state === 'BOARD') {
        if (player.walking) {
            const dx = player.targetX - player.x;
            const dy = player.targetY - player.y;
            const dist = Math.hypot(dx, dy);

            if (dist < player.speed) {
                player.x = player.targetX;
                player.y = player.targetY;
                player.walking = false;
                player.frame = 0;
                player.walkAnimTimer = 0;
                
                if (player.destinationBuilding) {
                    openBuilding(player.destinationBuilding);
                    player.destinationBuilding = null;
                }
            } else {
                player.x += (dx / dist) * player.speed;
                player.y += (dy / dist) * player.speed;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    player.facing = dx > 0 ? 'right' : 'left';
                } else {
                    player.facing = dy > 0 ? 'down' : 'up';
                }

                player.walkAnimTimer = (player.walkAnimTimer || 0) + dt;
                player.frame = Math.floor(player.walkAnimTimer * 8) % 4;

                // Restrição rígida: Zé Desenrasca caminha apenas na calçada e cais de pedra!
                // NUNCA entra na água do Rio Tejo (o rio fica em y >= 274, limite seguro y <= 255)
                player.x = Math.max(30, Math.min(610, player.x));
                player.y = Math.max(140, Math.min(255, player.y));

                if (Math.random() < 0.35) {
                    spawnDust(player.x + (Math.random() * 6 - 3), player.y + 2);
                }
            }
        } else {
            // Parado: sem movimento nem animação de passos (estável e firme no chão)
            player.frame = 0;
            player.walkAnimTimer = 0;

            // Balão de pensamento cómico ocasional (uma única escolha por ciclo)
            player.thoughtTimer += dt;
            if (player.thoughtTimer > 8.0) {
                if (!player.thoughtEmoji) {
                    const emojis = ['☕', '🐟', '🏠', '🍺', '💻', '💸', '🥪'];
                    player.thoughtEmoji = emojis[Math.floor(Math.random() * emojis.length)];
                }
                if (player.thoughtTimer > 10.5) {
                    player.thoughtTimer = 0;
                    player.thoughtEmoji = null;
                }
            }
        }
    }
}

// Avançar tempo
function consumeTime(hours, minutes = 0) {
    player.timeMinute += minutes;
    while (player.timeMinute >= 60) {
        player.timeMinute -= 60;
        player.timeHour += 1;
    }
    player.timeHour += hours;

    player.hunger = Math.max(0, player.hunger - (hours * 2));
    player.sanity = Math.max(0, player.sanity - (hours * 1));

    if (player.timeHour >= 24) {
        endDay("Meia-noite em Lisboa! O teu corpo desmaiou de sono.");
    }
}

// Fim de Turno / Dia
function endDay(motivo) {
    sfxAlert();
    player.day++;
    stats.daysSurvived = player.day;
    player.timeHour = 8;
    player.timeMinute = 0;

    // Renda semanal
    if (player.houseIndex === 0) {
        player.daysUntilRent = 0;
    } else {
        player.daysUntilRent--;
        const currentRent = HOUSES[player.houseIndex].rent;
        if (player.daysUntilRent <= 0) {
            if (player.wallet >= currentRent) {
                player.wallet -= currentRent;
                player.daysUntilRent = 7;
                stats.totalRentPaid += currentRent;
                spawnParticle(`- ${currentRent}€ RENDA`, '#ef4444');
                showToast("Renda semanal regularizada automaticamente da carteira.");
            } else if ((player.wallet + player.bank) >= currentRent) {
                const rem = currentRent - player.wallet;
                player.wallet = 0;
                player.bank -= rem;
                player.daysUntilRent = 7;
                stats.totalRentPaid += currentRent;
                spawnParticle(`- ${currentRent}€ RENDA`, '#ef4444');
                showToast("Renda semanal debitada da conta bancária.");
            } else {
                player.houseIndex = 0;
                player.daysUntilRent = 0;
                player.sanity = Math.max(0, player.sanity - 40);
                motivo = "DESPEJADO! Não conseguiste pagar a renda de " + currentRent + "€!";
            }
        }
    }

    player.hunger = Math.max(0, player.hunger - 18);
    player.sanity = Math.max(0, Math.min(100, player.sanity - HOUSES[player.houseIndex].sanityDrain));

    // Comer da despensa
    if (player.hunger < 40 && player.groceries > 0) {
        player.groceries--;
        player.hunger = Math.min(100, player.hunger + 45);
        spawnParticle("+ Atum de Casa", '#10b981');
    }

    if (player.hunger <= 0) player.hungerDays++;
    else player.hungerDays = 0;

    if (player.hungerDays >= 3) {
        triggerGameOver("FALECIMENTO POR INANIÇÃO", "Passaste 3 dias consecutivos sem comer uma única refeição em Lisboa.");
        return;
    }
    if (player.sanity <= 0) {
        triggerGameOver("BURNOUT EXISTENCIAL", "A pressão das rendas e a exaustão derreteram a tua sanidade mental.");
        return;
    }

    // Vitória: Sobreviver 30 dias + T1 no Chiado + Topo de uma Carreira (Rank 3)
    const hasTopCareer = Object.values(player.careerRanks || {}).some(r => r >= 3) || player.careerIndex >= 3;
    if (player.day >= 30 && player.houseIndex >= 4 && hasTopCareer) {
        triggerVictory();
        return;
    }

    // O jogador recolhe à porta de casa para dormir
    const casa = BUILDINGS.find(b => b.id === 'casa');
    if (casa) {
        player.x = casa.x + casa.w / 2;
        player.y = casa.y + casa.h + 12;
        player.targetX = player.x;
        player.targetY = player.y;
    }

    // Sortear evento aleatório lisboeta com impacto real e 100% contextual
    currentEvent = generateMorningEvent(player);
    currentEvent.effect(player);
    if (currentEvent.good) {
        sfxCoin();
        spawnParticle(currentEvent.badge, '#10b981');
    } else {
        sfxAlert();
        spawnParticle(currentEvent.badge, '#ef4444');
    }

    state = 'NEWS';
}

function triggerGameOver(titulo, causa) {
    state = 'GAMEOVER';
    player.deathTitle = titulo;
    player.deathCause = causa;
    sfxAlert();
}

function triggerVictory() {
    state = 'VICTORY';
    sfxWin();
}

            renderLisbonLight();

            renderBoard();
            renderPigeons();
            renderPlayer();
            renderParticles();
            renderLisbonLight();
            renderHUD();
        }
    } else if (state === 'GAMEOVER') {
        renderGameOverScreen();
    } else if (state === 'VICTORY') {
        renderVictoryScreen();
    }
}

// Função utilitária de quebra de texto (Word Wrapping com limite rígido)
function wrapTextCanvas(targetCtx, text, x, y, maxWidth, lineHeight, font, color, align = 'left', maxY = null) {
    targetCtx.font = font;
    targetCtx.fillStyle = color;
    targetCtx.textAlign = align;

    const words = String(text).split(' ');
    let line = '';
    let curY = y;

    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const testWidth = targetCtx.measureText(testLine).width;
        if (testWidth > maxWidth && n > 0) {
            if (maxY && (curY + lineHeight > maxY)) {
                let clipped = line.trim();
                while (targetCtx.measureText(clipped + '...').width > maxWidth && clipped.length > 3) {
                    clipped = clipped.slice(0, -4);
                }
                targetCtx.fillText(clipped + '...', x, curY);
                return curY;
            }
            targetCtx.fillText(line.trim(), x, curY);
            line = words[n] + ' ';
            curY += lineHeight;
        } else {
            line = testLine;
        }
    }
    if (!maxY || (curY <= maxY)) {
        targetCtx.fillText(line.trim(), x, curY);
    }
    return curY;
}

// Gaivotas sobre o Rio Tejo
function drawSeagulls(time) {
    const seagulls = [
        { x: (time * 26 + 60) % (canvas.width + 60) - 30, y: 268 + Math.sin(time * 2.5) * 4 },
        { x: (time * 20 + 320) % (canvas.width + 60) - 30, y: 272 + Math.cos(time * 2.2) * 3 }
    ];
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    seagulls.forEach((sg, idx) => {
        const flap = Math.sin(time * 9 + idx * 3) > 0 ? 2 : -2;
        ctx.beginPath();
        ctx.moveTo(sg.x - 5, sg.y + flap);
        ctx.lineTo(sg.x, sg.y);
        ctx.lineTo(sg.x + 5, sg.y + flap);
        ctx.stroke();
    });
}

// Luz de Lisboa em tempo real de acordo com as horas
function renderLisbonLight() {
    const hr = player.timeHour;
    let overlayColor = null;

    if (hr >= 17 && hr <= 19) {
        // Entardecer Dourado de Lisboa (Golden Hour)
        const factor = (hr - 17 + player.timeMinute / 60) / 3;
        overlayColor = `rgba(245, 158, 11, ${0.08 + factor * 0.12})`;
    } else if (hr >= 20 && hr <= 21) {
        // Crepúsculo / Hora Azul
        overlayColor = 'rgba(99, 102, 241, 0.18)';
    } else if (hr >= 22 || hr < 7) {
        // Noite Alfacinha
        overlayColor = 'rgba(11, 15, 26, 0.42)';
    }

    if (overlayColor) {
        ctx.fillStyle = overlayColor;
        ctx.fillRect(0, 0, canvas.width, 295);
    }
}

// Renderizar o Tabuleiro com Qualidade Gráfica 16-Bit Artesanal (Stardew Valley / Eastward)
function renderBoard() {
    const hr = player.timeHour;
    const isNight = (hr >= 20 || hr < 7);

    // 1. Render do Tabuleiro Bitmapped em Pixel Art Artesanal de 16-Bit
    if (boardImg.complete && boardImg.naturalWidth > 0) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(boardImg, 0, 0, canvas.width, 295);
    } else {
        // Fallback procedural clássico enquanto a imagem carrega
        drawLisbonSkyline();
        ctx.drawImage(calcadaCanvas, 0, 0);
        BUILDINGS.forEach(b => drawBuilding(b));
    }

    // 2. Placas, Banners e Efeitos Interativos de Edifícios (Estilo Stardew Valley)
    renderBuildingOverlays();

    // 3. Halos de Luz dos Candeeiros Históricos à Noite na Calçada
    if (isNight) {
        LANTERNS.forEach(l => {
            const grad = ctx.createRadialGradient(l.x, l.y + 6, 2, l.x, l.y + 16, 28);
            grad.addColorStop(0, 'rgba(254, 240, 138, 0.45)');
            grad.addColorStop(0.5, 'rgba(245, 158, 11, 0.15)');
            grad.addColorStop(1, 'rgba(245, 158, 11, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(l.x, l.y + 16, 28, 0, Math.PI * 2);
            ctx.fill();
        });
    }
}

// Skyline de Lisboa ao fundo (Castelo de São Jorge, telhados de Alfama e colinas)
function drawLisbonSkyline() {
    const hr = player.timeHour;
    const isSunset = (hr >= 17 && hr <= 19);
    const isNight = (hr >= 20 || hr < 7);

    // 1. Céu com Gradiente Dinâmico
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 48);
    if (isSunset) {
        skyGrad.addColorStop(0, '#f97316'); // Laranja pôr-do-sol
        skyGrad.addColorStop(0.6, '#fbbf24');
        skyGrad.addColorStop(1, '#fde047');
    } else if (isNight) {
        skyGrad.addColorStop(0, '#020617'); // Noite estrelada
        skyGrad.addColorStop(0.7, '#0f172a');
        skyGrad.addColorStop(1, '#1e1b4b');
    } else {
        skyGrad.addColorStop(0, '#38bdf8'); // Azul celeste de Lisboa
        skyGrad.addColorStop(0.8, '#bae6fd');
        skyGrad.addColorStop(1, '#e0f2fe');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, 46);

    // 2. Estrelas e Lua de Lisboa à noite
    if (isNight) {
        ctx.fillStyle = '#fef08a';
        // Lua crescente de Lisboa
        ctx.beginPath();
        ctx.arc(60, 16, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(63, 14, 6, 0, Math.PI * 2);
        ctx.fill();

        // Estrelas cintilantes
        ctx.fillStyle = '#ffffff';
        [[120, 10], [190, 18], [280, 8], [360, 14], [430, 9], [510, 16], [580, 11]].forEach(([sx, sy], idx) => {
            if ((Math.floor(animTimer * 2 + idx) % 2) === 0) {
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }
        });
    }

    // 3. Silhueta dos Montes e Castelo de São Jorge (Camada distante)
    ctx.fillStyle = isSunset ? '#7c2d12' : (isNight ? '#090d16' : '#94a3b8');
    ctx.beginPath();
    ctx.moveTo(0, 42);
    ctx.quadraticCurveTo(80, 24, 180, 32);
    ctx.quadraticCurveTo(240, 20, 310, 26);
    ctx.quadraticCurveTo(390, 14, 490, 30);
    ctx.quadraticCurveTo(560, 22, 640, 36);
    ctx.lineTo(640, 48);
    ctx.lineTo(0, 48);
    ctx.closePath();
    ctx.fill();

    // Muralhas e Ameias do Castelo de São Jorge (ao cimo da colina central)
    ctx.fillStyle = isSunset ? '#9a3412' : (isNight ? '#0f172a' : '#64748b');
    ctx.fillRect(365, 14, 38, 12);
    // Ameias
    for (let bx = 366; bx < 402; bx += 7) {
        ctx.fillRect(bx, 10, 4, 5);
    }
    // Torre de Menagem com Bandeira de Portugal
    ctx.fillRect(380, 6, 10, 8);
    ctx.fillStyle = '#15803d'; ctx.fillRect(391, 5, 3, 4); // Verde
    ctx.fillStyle = '#dc2626'; ctx.fillRect(394, 5, 4, 4); // Vermelho

    // 4. Telhados em cascata de Alfama na encosta
    ctx.fillStyle = isSunset ? '#c2410c' : (isNight ? '#1e293b' : '#b45309');
    for (let rx = 10; rx < 630; rx += 36) {
        const rh = 6 + (rx % 5);
        ctx.fillRect(rx, 34 - rh, 18, rh + 8);
        ctx.beginPath();
        ctx.moveTo(rx - 2, 34 - rh);
        ctx.lineTo(rx + 9, 28 - rh);
        ctx.lineTo(rx + 20, 34 - rh);
        ctx.closePath();
        ctx.fill();
    }

    // Pinheiros Mansos e Ciprestes de Lisboa
    ctx.fillStyle = isSunset ? '#365314' : (isNight ? '#052e16' : '#166534');
    [[45, 30], [140, 26], [290, 22], [420, 24], [540, 28]].forEach(([tx, ty]) => {
        // Copa do pinheiro manso
        ctx.beginPath();
        ctx.arc(tx, ty, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(tx - 1, ty + 6, 2, 8);
    });
}

// Mobiliário Urbano de Lisboa (Marco CTT, Papeleira CML, Tampas de Saneamento)
function drawStreetFurniture() {
    // 1. Marco do Correio Vermelho dos CTT (Cilíndrico clássico português)
    const mx = 160, my = 186;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath(); ctx.ellipse(mx + 5, my + 14, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
    // Corpo cilíndrico vermelho
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(mx, my, 10, 14);
    // Cúpula redonda CTT
    ctx.beginPath(); ctx.arc(mx + 5, my, 5, Math.PI, 0); ctx.fill();
    // Friso dourado e ranhura de cartas
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(mx + 1, my + 4, 8, 2);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(mx + 2, my + 5, 6, 1);

    // 2. Papeleira Verde de Ferro Fundido da CML (Câmara Municipal de Lisboa)
    const px = 445, py = 188;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath(); ctx.ellipse(px + 4, py + 12, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    // Poste e cesto verde escuro
    ctx.fillStyle = '#14532d';
    ctx.fillRect(px + 3, py + 2, 3, 10);
    ctx.fillRect(px, py - 4, 9, 8);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(px + 3, py - 1, 3, 2); // Emblema CML

    // 3. Tampa de Saneamento em Ferro Fundido com relevo 'CML'
    const sx = 290, sy = 168;
    ctx.fillStyle = '#334155';
    ctx.beginPath(); ctx.ellipse(sx, sy, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(sx - 5, sy - 1, 10, 2);

    // 4. Murete / Parapeto de cantaria no Cais das Colunas (separando a rua do Tejo)
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(0, 271, canvas.width, 4);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(0, 273, canvas.width, 2);
    // Pilaretes de pedra
    for (let bx = 10; bx < canvas.width; bx += 64) {
        ctx.fillStyle = '#f1f5f9';
        ctx.fillRect(bx, 268, 6, 7);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(bx + 4, 268, 2, 7);
    }
}


// ============================================================================
// ARQUITETURA 16-BIT ARTESANAL DOS EDIFÍCIOS DE LISBOA
// ============================================================================

function drawBuilding(b) {
    const isHovered = (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h);
    const hr = player.timeHour;
    const isNight = (hr >= 20 || hr < 7);
    const isSunset = (hr >= 17 && hr <= 19);

    // Sombra Projetada Suave debaixo do Edifício (2.5D Depth)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.beginPath();
    ctx.ellipse(b.x + b.w / 2, b.y + b.h + 2, b.w / 2 + 4, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // ------------------------------------------------------------------------
    // [CASO ESPECIAL]: A TUA CASA (Evolução em 5 Graus de Habitação)
    // ------------------------------------------------------------------------
    if (b.id === 'casa') {
        drawHouseBuilding(b, isHovered, isNight);
        return;
    }

    // ------------------------------------------------------------------------
    // [01] SENHORIO: Prédio Pombalino Ocre Decadente (Jerónimo & Filhos)
    // ------------------------------------------------------------------------
    if (b.id === 'senhorio') {
        // Fachada Ocre com reboco envelhecido
        ctx.fillStyle = isSunset ? '#b45309' : '#ca8a04';
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Tijolo exposto num canto (reboco caído)
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(b.x + 3, b.y + b.h - 18, 12, 10);
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(b.x + 3, b.y + b.h - 14, 12, 1);
        ctx.fillRect(b.x + 9, b.y + b.h - 18, 1, 10);

        // Soco de Cantaria de Lioz na Base
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(b.x, b.y + b.h - 6, b.w, 6);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(b.x, b.y + b.h - 2, b.w, 2);

        // Telhado de Telha Portuguesa de Terracota com Chaminé Dupla
        drawTerracottaRoof(b.x, b.y, b.w, '#b45309', '#78350f');
        // Chaminé com fumo
        ctx.fillStyle = '#78350f';
        ctx.fillRect(b.x + 12, b.y - 18, 8, 12);
        ctx.fillStyle = '#451a03';
        ctx.fillRect(b.x + 10, b.y - 20, 12, 2);

        // Roupa Estendida na fachada
        drawClothesline(b.x + 6, b.y + 24, b.w - 12);

        // Janelas de Guilhotina com Portadas Verdes
        drawShutteredWindow(b.x + 10, b.y + 8, 16, 20, '#15803d', isNight);
        drawShutteredWindow(b.x + b.w - 26, b.y + 8, 16, 20, '#15803d', isNight);

        // Sacada de Ferro Forjado com Vasos de Sardinheiras
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + 8, b.y + 25, 20, 5);
        ctx.fillRect(b.x + b.w - 28, b.y + 25, 20, 5);
        // Flores vermelhas
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(b.x + 10, b.y + 23, 5, 3);
        ctx.fillRect(b.x + b.w - 26, b.y + 23, 5, 3);

        // Porta Principal Pombalina em Arco de Lioz
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(b.x + b.w / 2 - 11, b.y + b.h - 26, 22, 26);
        ctx.fillStyle = '#451a03';
        ctx.fillRect(b.x + b.w / 2 - 9, b.y + b.h - 24, 18, 24);
        // Aldrava de latão
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(b.x + b.w / 2 + 3, b.y + b.h - 14, 2, 3);

        // Placa do Senhorio
        drawStoreSign(b, isHovered, '#ef4444', 'JERÓNIMO · RENDAS');
        return;
    }

    // ------------------------------------------------------------------------
    // [02] POLI/IST (FACULDADE): Fachada Monumental Neoclássica de Lioz
    // ------------------------------------------------------------------------
    if (b.id === 'faculdade') {
        // Fachada de Pedra de Lioz Clássica
        ctx.fillStyle = isSunset ? '#fed7aa' : '#f1f5f9';
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Frontão Triangular Neoclássico
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.moveTo(b.x - 4, b.y);
        ctx.lineTo(b.x + b.w / 2, b.y - 18);
        ctx.lineTo(b.x + b.w + 4, b.y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Emblema Académico Dourado no Frontão
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(b.x + b.w / 2, b.y - 7, 5, 0, Math.PI * 2);
        ctx.fill();

        // 4 Colunas Neoclássicas com Caneluras
        const colW = 6;
        [b.x + 6, b.x + 28, b.x + b.w - 34, b.x + b.w - 12].forEach(cx => {
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(cx, b.y, colW, b.h);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx + 1, b.y, 2, b.h); // Reflexo de luz na coluna
        });

        // Janelas em Arco com Vitral Azul
        ctx.fillStyle = isNight ? '#fde047' : '#0284c7';
        ctx.fillRect(b.x + 14, b.y + 10, 10, 16);
        ctx.fillRect(b.x + b.w - 24, b.y + 10, 10, 16);
        ctx.beginPath(); ctx.arc(b.x + 19, b.y + 10, 5, Math.PI, 0); ctx.fill();
        ctx.beginPath(); ctx.arc(b.x + b.w - 19, b.y + 10, 5, Math.PI, 0); ctx.fill();

        // Grande Portal Universitário
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + b.w / 2 - 12, b.y + b.h - 26, 24, 26);
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(b.x + b.w / 2 - 10, b.y + b.h - 24, 20, 24);

        drawStoreSign(b, isHovered, '#38bdf8', 'POLITEC / IST');
        return;
    }

    // ------------------------------------------------------------------------
    // [03] STARTUP HUB: Loft Industrial em Tijolo com Neon Verde
    // ------------------------------------------------------------------------
    if (b.id === 'startup') {
        // Fachada de Tijolo Vermelho Industrial
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Padrão de Tijolos
        ctx.fillStyle = '#991b1b';
        for (let ty = b.y + 3; ty < b.y + b.h - 4; ty += 6) {
            const off = (ty % 12 === 0) ? 0 : 5;
            for (let tx = b.x + 3 + off; tx < b.x + b.w - 4; tx += 10) {
                ctx.fillRect(tx, ty, 8, 4);
            }
        }

        // Conduta metálica de ar condicionado no telhado
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(b.x + 8, b.y - 10, 28, 10);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(b.x + 32, b.y - 14, 8, 14);

        // Grande Janela Panorâmica Crittall com luz quente
        ctx.fillStyle = isNight ? '#fef08a' : '#fed7aa';
        ctx.fillRect(b.x + 8, b.y + 8, b.w - 16, 20);
        // Caixilharia de Ferro Preto
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + 8, b.y + 17, b.w - 16, 2);
        for (let wx = b.x + 22; wx < b.x + b.w - 10; wx += 16) {
            ctx.fillRect(wx, b.y + 8, 2, 20);
        }

        // Letreiro Néon Verde a Pulsar
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 7px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText(">_ HUB", b.x + b.w / 2, b.y + 40);

        // Porta de Vidro e Aço
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + b.w / 2 - 10, b.y + b.h - 22, 20, 22);
        ctx.fillStyle = '#06b6d4';
        ctx.fillRect(b.x + b.w / 2 - 8, b.y + b.h - 20, 16, 20);

        drawStoreSign(b, isHovered, '#10b981', 'STARTUP HUB');
        return;
    }

    // ------------------------------------------------------------------------
    // [04] TASCA TI ZÉ: Toldo às Riscas, Azulejos em Xadrez e Barril
    // ------------------------------------------------------------------------
    if (b.id === 'tasca') {
        // Fachada Tradicional Branca
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Telhado de Telha
        drawTerracottaRoof(b.x, b.y, b.w, '#ea580c', '#9a3412');

        // Roupa Estendida no andar de cima
        drawClothesline(b.x + 8, b.y + 16, b.w - 16);

        // Lambrim Inferior de Azulejos Xadrez Azul e Branco
        for (let ay = b.y + b.h - 20; ay < b.y + b.h; ay += 6) {
            for (let ax = b.x; ax < b.x + b.w; ax += 6) {
                ctx.fillStyle = ((ax + ay) % 12 === 0) ? '#1d4ed8' : '#ffffff';
                ctx.fillRect(ax, ay, 6, 6);
            }
        }

        // Toldo de Lona às Riscas Verdes e Brancas
        const awningY = b.y + 26;
        for (let ax = b.x - 2; ax < b.x + b.w + 2; ax += 10) {
            ctx.fillStyle = ((ax / 10) % 2 === 0) ? '#15803d' : '#ffffff';
            ctx.fillRect(ax, awningY, 10, 10);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(ax, awningY + 10, 10, 2); // Sombra do toldo
        }

        // Porta da Tasca e Cortina de Plástico às Fitas
        ctx.fillStyle = '#451a03';
        ctx.fillRect(b.x + 12, b.y + b.h - 24, 20, 24);
        ctx.fillStyle = isNight ? '#fbbf24' : '#fed7aa'; // Interior iluminado
        ctx.fillRect(b.x + 14, b.y + b.h - 22, 16, 22);

        // Barril de Vinho Típico à Porta
        ctx.fillStyle = '#78350f';
        ctx.fillRect(b.x + b.w - 18, b.y + b.h - 16, 12, 15);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(b.x + b.w - 18, b.y + b.h - 13, 12, 2);
        ctx.fillRect(b.x + b.w - 18, b.y + b.h - 5, 12, 2);

        // Quadro de Giz: 'Bitoque / Iscas'
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + b.w - 38, b.y + 40, 16, 20);
        ctx.fillStyle = '#fef08a';
        ctx.font = '6px "Fira Code"';
        ctx.fillText("BITOQ", b.x + b.w - 36, b.y + 49);
        ctx.fillText("SAGR", b.x + b.w - 36, b.y + 56);

        drawStoreSign(b, isHovered, '#f59e0b', 'TASCA TI ZÉ');
        return;
    }

    // ------------------------------------------------------------------------
    // [05] PINGO DOCE: Mercearia Moderna com Caixas de Fruta
    // ------------------------------------------------------------------------
    if (b.id === 'supermercado') {
        // Fachada Verde e Laranja Oficial
        ctx.fillStyle = '#166534';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#ea580c';
        ctx.fillRect(b.x, b.y + 12, b.w, 4);

        // Grande Montra com Latas de Conserva e Fruta
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + 8, b.y + 20, b.w - 16, 24);
        ctx.fillStyle = isNight ? '#fef08a' : '#bae6fd';
        ctx.fillRect(b.x + 10, b.y + 22, b.w - 20, 20);

        // Prateleiras visíveis na montra
        ctx.fillStyle = '#ea580c'; ctx.fillRect(b.x + 12, b.y + 26, 8, 4); // Latas Bom Petisco
        ctx.fillStyle = '#eab308'; ctx.fillRect(b.x + 22, b.y + 26, 8, 4);
        ctx.fillStyle = '#15803d'; ctx.fillRect(b.x + 32, b.y + 26, 8, 4);

        // Caixas de Fruta de Madeira no Passeio
        ctx.fillStyle = '#92400e';
        ctx.fillRect(b.x + 6, b.y + b.h - 12, 14, 10);
        ctx.fillStyle = '#f97316'; // Laranjas do Algarve
        for (let ox = b.x + 8; ox < b.x + 18; ox += 4) {
            ctx.beginPath(); ctx.arc(ox, b.y + b.h - 10, 2, 0, Math.PI * 2); ctx.fill();
        }

        // Portas Automáticas de Vidro
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + b.w - 28, b.y + b.h - 24, 22, 24);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(b.x + b.w - 26, b.y + b.h - 22, 18, 22);

        drawStoreSign(b, isHovered, '#86efac', 'PINGO DOCE');
        return;
    }

    // ------------------------------------------------------------------------
    // [06] CAIXA / BANCO: Cofre Imponente de Granito e Grades de Ferro
    // ------------------------------------------------------------------------
    if (b.id === 'banco') {
        // Alvenaria de Granito Cinzento
        ctx.fillStyle = '#475569';
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Friso de Cantaria
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(b.x, b.y, b.w, 8);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(b.x, b.y + 8, b.w, 2);

        // Janelas Pequenas com Grades de Ferro Espessas
        [b.x + 12, b.x + b.w - 26].forEach(wx => {
            ctx.fillStyle = isNight ? '#fbbf24' : '#0f172a';
            ctx.fillRect(wx, b.y + 16, 14, 18);
            ctx.fillStyle = '#020617';
            ctx.fillRect(wx + 3, b.y + 16, 2, 18); // Grade 1
            ctx.fillRect(wx + 9, b.y + 16, 2, 18); // Grade 2
        });

        // Porta Blindada em Bronze e Ouro
        ctx.fillStyle = '#78350f';
        ctx.fillRect(b.x + b.w / 2 - 12, b.y + b.h - 26, 24, 26);
        ctx.fillStyle = '#ca8a04';
        ctx.fillRect(b.x + b.w / 2 - 10, b.y + b.h - 24, 20, 24);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(b.x + b.w / 2 - 1, b.y + b.h - 14, 3, 3); // Fechadura cofre

        // Câmara de Vigilância a piscar
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + b.w - 10, b.y + 10, 6, 4);
        ctx.fillStyle = (Math.floor(animTimer * 3) % 2 === 0) ? '#ef4444' : '#000000';
        ctx.fillRect(b.x - 2, b.y + 10, 3, 3);

        drawStoreSign(b, isHovered, '#facc15', 'CAIXA / BANCO');
        return;
    }

    // ------------------------------------------------------------------------
    // [07] MIRADOURO: Pérgola Florida de Santa Luzia & Buganvílias
    // ------------------------------------------------------------------------
    if (b.id === 'miradouro') {
        // Balustrada de Pedra e Pérgola Aberta sobre o Tejo
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // 3 Colunas de Pedra Clássicas da Pérgola
        [b.x + 6, b.x + b.w / 2 - 3, b.x + b.w - 12].forEach(colX => {
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(colX, b.y + 6, 6, b.h - 14);
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(colX + 4, b.y + 6, 2, b.h - 14);
        });

        // Vigas de Madeira no topo da Pérgola
        ctx.fillStyle = '#78350f';
        ctx.fillRect(b.x, b.y + 4, b.w, 4);
        for (let vx = b.x + 4; vx < b.x + b.w; vx += 12) {
            ctx.fillRect(vx, b.y, 4, 10);
        }

        // Buganvílias Roxas e Rosas Floridas em Cascata
        ctx.fillStyle = '#c026d3';
        [[b.x + 8, b.y + 8], [b.x + 18, b.y + 4], [b.x + 42, b.y + 6], [b.x + 65, b.y + 8], [b.x + 80, b.y + 12]].forEach(([bx, by]) => {
            ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.fill();
        });
        ctx.fillStyle = '#db2777';
        [[b.x + 12, b.y + 10], [b.x + 46, b.y + 10], [b.x + 72, b.y + 6]].forEach(([bx, by]) => {
            ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fill();
        });

        // Painel Histórico de Azulejos de Lisboa
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(b.x + 22, b.y + 24, 46, 26);
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x + 22, b.y + 24, 46, 26);
        ctx.fillStyle = '#2563eb';
        ctx.fillText("LISBOA", b.x + 28, b.y + 40);

        // Banco de Pedra para Namorar o Tejo
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(b.x + 18, b.y + b.h - 12, 54, 6);
        ctx.fillStyle = '#64748b';
        ctx.fillRect(b.x + 22, b.y + b.h - 6, 6, 6);
        ctx.fillRect(b.x + 62, b.y + b.h - 6, 6, 6);

        drawStoreSign(b, isHovered, '#38bdf8', 'MIRADOURO');
        return;
    }
}

// Renderizador Artesanal das 5 Habitações de 'A Tua Casa'
function drawHouseBuilding(b, isHovered, isNight) {
    const curHouse = HOUSES[player.houseIndex];
    b.name = curHouse.name;
    b.tag = curHouse.qual;
    b.icon = curHouse.icon;

    if (player.houseIndex === 0) {
        // NÍVEL 0: BANCO DE JARDIM DO ROSSIO (Despejado ao relento)
        // Árvore do Rossio frondosa
        ctx.fillStyle = '#166534';
        ctx.beginPath();
        ctx.arc(b.x + 22, b.y + 20, 18, 0, Math.PI * 2);
        ctx.arc(b.x + 46, b.y + 16, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#78350f';
        ctx.fillRect(b.x + 22, b.y + 32, 6, 30);

        // Banco de Jardim em ripas de madeira
        ctx.fillStyle = '#92400e';
        ctx.fillRect(b.x + 36, b.y + 38, 46, 7);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + 40, b.y + 45, 4, 16);
        ctx.fillRect(b.x + 74, b.y + 45, 4, 16);

        // Saco-cama azul e caixa de cartão 'T0'
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(b.x + 38, b.y + 33, 26, 6);
        ctx.fillStyle = '#b45309';
        ctx.fillRect(b.x + 66, b.y + 28, 16, 14);
        ctx.fillStyle = '#fef08a';
        ctx.font = '6px "Press Start 2P"';
        ctx.fillText("T0", b.x + 74, b.y + 38);

        drawStoreSign(b, isHovered, '#ef4444', 'BANCO ROSSIO');
        return;
    }

    if (player.houseIndex === 1) {
        // NÍVEL 1: Beliche em Arroios (Prédio de inquilinos com estendal)
        ctx.fillStyle = '#475569';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        drawTerracottaRoof(b.x, b.y, b.w, '#c2410c', '#7c2d12');
        drawClothesline(b.x + 6, b.y + 24, b.w - 12);
        drawShutteredWindow(b.x + 10, b.y + 8, 16, 18, '#334155', isNight);
        drawShutteredWindow(b.x + b.w - 26, b.y + 8, 16, 18, '#334155', isNight);
        drawSimpleDoor(b.x + b.w / 2 - 8, b.y + b.h - 22, 16, 22, '#1e293b');
        drawStoreSign(b, isHovered, '#818cf8', b.name);
        return;
    }

    if (player.houseIndex === 2) {
        // NÍVEL 2: Quarto nos Anjos (Portadas verdes e vaso de manjerico)
        ctx.fillStyle = '#312e81';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        drawTerracottaRoof(b.x, b.y, b.w, '#ea580c', '#9a3412');
        drawShutteredWindow(b.x + 10, b.y + 10, 16, 20, '#15803d', isNight);
        drawShutteredWindow(b.x + b.w - 26, b.y + 10, 16, 20, '#15803d', isNight);
        // Vaso de manjerico com cravo
        ctx.fillStyle = '#ea580c'; ctx.fillRect(b.x + 12, b.y + 28, 8, 5);
        ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.arc(b.x + 16, b.y + 27, 4, 0, Math.PI * 2); ctx.fill();
        drawSimpleDoor(b.x + b.w / 2 - 8, b.y + b.h - 22, 16, 22, '#451a03');
        drawStoreSign(b, isHovered, '#818cf8', b.name);
        return;
    }

    if (player.houseIndex === 3) {
        // NÍVEL 3: T0 em Alfama (Azulejos azuis genuínos e sardinha decorativa)
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        // Painéis de Azulejo Azul de Alfama
        for (let ay = b.y + 10; ay < b.y + b.h - 10; ay += 8) {
            for (let ax = b.x + 4; ax < b.x + b.w - 4; ax += 8) {
                ctx.fillStyle = ((ax + ay) % 16 === 0) ? '#1d4ed8' : '#ffffff';
                ctx.fillRect(ax, ay, 6, 6);
            }
        }
        drawTerracottaRoof(b.x, b.y, b.w, '#ea580c', '#9a3412');
        drawShutteredWindow(b.x + 10, b.y + 8, 16, 18, '#1e3a8a', isNight);
        drawShutteredWindow(b.x + b.w - 26, b.y + 8, 16, 18, '#1e3a8a', isNight);
        drawSimpleDoor(b.x + b.w / 2 - 8, b.y + b.h - 22, 16, 22, '#1e3a8a');
        drawStoreSign(b, isHovered, '#38bdf8', b.name);
        return;
    }

    if (player.houseIndex === 4) {
        // NÍVEL 4: T1 no Chiado (Pombalino dourado com sacada francesa de ferro)
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        drawTerracottaRoof(b.x, b.y, b.w, '#b45309', '#78350f');
        // Mansarda / Trapeira no telhado
        ctx.fillStyle = '#451a03';
        ctx.fillRect(b.x + b.w / 2 - 8, b.y - 12, 16, 12);
        ctx.fillStyle = '#fde047';
        ctx.fillRect(b.x + b.w / 2 - 5, b.y - 10, 10, 8);

        // Sacadas de Ferro Forjado Dourado do Chiado
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x + 8, b.y + 8, 20, 22);
        ctx.strokeRect(b.x + b.w - 28, b.y + 8, 20, 22);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x + 6, b.y + 24, 24, 6);
        ctx.fillRect(b.x + b.w - 30, b.y + 24, 24, 6);

        // Porta Nobre de Madeira Escura
        drawSimpleDoor(b.x + b.w / 2 - 9, b.y + b.h - 24, 18, 24, '#3b1d11');
        drawStoreSign(b, isHovered, '#facc15', b.name);
        return;
    }
}

// Utilitários de Desenho Arquitetural 16-Bit
function drawTerracottaRoof(x, y, w, colLight, colDark) {
    ctx.fillStyle = colLight;
    ctx.beginPath();
    ctx.moveTo(x - 5, y);
    ctx.lineTo(x + w / 2, y - 14);
    ctx.lineTo(x + w + 5, y);
    ctx.closePath();
    ctx.fill();

    // Textura de Telhas Romanas em fileiras
    ctx.fillStyle = colDark;
    for (let ty = y - 11; ty < y; ty += 4) {
        const factor = (ty - (y - 14)) / 14;
        const curW = w * factor;
        ctx.fillRect(x + w / 2 - curW / 2, ty, curW, 1.5);
    }
}

function drawShutteredWindow(x, y, w, h, shutterColor, isNight) {
    // Portadas de Madeira
    ctx.fillStyle = shutterColor;
    ctx.fillRect(x - 4, y, 4, h);
    ctx.fillRect(x + w, y, 4, h);

    // Vidro (Iluminado à noite, reflexo ciano de dia)
    ctx.fillStyle = isNight ? '#fef08a' : '#0f172a';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = isNight ? '#fbbf24' : '#38bdf8';
    ctx.fillRect(x + 2, y + 2, w / 2 - 3, h / 2 - 3);

    // Caixilho de Lioz
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
}

function drawSimpleDoor(x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(x + w - 4, y + h / 2, 2, 3); // Maçaneta
}

function drawStoreSign(b, isHovered, accentCol, text) {
    ctx.fillStyle = 'rgba(11, 14, 20, 0.95)';
    ctx.fillRect(b.x - 6, b.y + b.h + 2, b.w + 12, 17);
    ctx.strokeStyle = isHovered ? '#ffffff' : accentCol;
    ctx.lineWidth = isHovered ? 2 : 1;
    ctx.strokeRect(b.x - 6, b.y + b.h + 2, b.w + 12, 17);

    ctx.fillStyle = isHovered ? '#f59e0b' : '#ffffff';
    ctx.font = 'bold 9px "Fira Code"';
    ctx.textAlign = 'center';
    ctx.fillText(text, b.x + b.w / 2, b.y + b.h + 14);
}

function drawTram(x, y) {
    if (x < -60 || x > canvas.width + 60) return;
    ctx.fillStyle = '#eab308';
    ctx.fillRect(x, y, 48, 19);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 2, y - 3, 44, 4);
    ctx.fillStyle = '#0f172a';
    for (let i = 0; i < 4; i++) {
        ctx.fillRect(x + 5 + i * 10, y + 3, 6, 8);
    }
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(x + 46, y + 9, 3, 4);
}

// ============================================================================
// 16-BIT AVATAR ARTESANAL: ZÉ DESENRASCA (ESTILO STARDEW VALLEY / EASTWARD)
// ============================================================================
function renderPlayer() {
    const px = Math.round(player.x);
    const py = Math.round(player.y);

    // Sombra suave sob as botas
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.ellipse(px, py + 1, 9, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (zeSheetImg.complete && zeSheetImg.naturalWidth > 0) {
        let dirRow = 0; // Down (facing south)
        if (player.facing === 'up') dirRow = 1;
        else if (player.facing === 'right') dirRow = 2;
        else if (player.facing === 'left') dirRow = 3;

        // Se parado, o frame é estritamente 0 (pose de pé estável, sem jitter nem alternância)
        // Se a andar, usa o ciclo player.frame (0..3)
        const frame = player.walking ? (player.frame % 4) : 0;

        ctx.imageSmoothingEnabled = false;
        // Cada frame tem 32x40, centrado em px com pés exatamente em py (sem bob jitter quando parado!)
        ctx.drawImage(
            zeSheetImg,
            frame * 32, dirRow * 40, 32, 40,
            px - 16, py - 38, 32, 40
        );

        // Gota de Suor Cómica se a Sanidade estiver abaixo de 40%
        if (player.sanity < 40) {
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(px + 9, py - 34, 2, 3);
            ctx.fillRect(px + 8, py - 32, 4, 2);
        }

        // ====================================================================
        // CENSURA PIXELIZADA DE NUDEZ & ADORNOS DE VESTUÁRIO (The Sims Mosaic)
        // ====================================================================
        if (player.clothing && (player.clothing.id === 'nude' || player.clothing.durability <= 0)) {
            // Mosaico animado de censura pixelizada (16-bit blur mosaic)
            const mosaicW = 20;
            const mosaicH = 18;
            const mosaicX = px - 10;
            const mosaicY = py - 24;
            const blockSize = 4;
            const censorPalette = [
                '#fbcfe8', '#fed7aa', '#f472b6', '#e2e8f0', '#fdba74', '#94a3b8', '#f87171'
            ];
            const tSeed = Math.floor(animTimer * 14);
            for (let bx = 0; bx < mosaicW; bx += blockSize) {
                for (let by = 0; by < mosaicH; by += blockSize) {
                    const cIdx = Math.abs(Math.floor(Math.sin((bx + tSeed) * 9 + (by + tSeed) * 5) * 100)) % censorPalette.length;
                    ctx.fillStyle = censorPalette[cIdx];
                    ctx.fillRect(mosaicX + bx, mosaicY + by, blockSize, blockSize);
                }
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1;
            ctx.strokeRect(mosaicX, mosaicY, mosaicW, mosaicH);

            if (!player.thoughtEmoji) {
                player.thoughtEmoji = "😳";
            }
        } else if (player.clothing && player.clothing.id === 'suit') {
            // Fato Pombalino Formal: Lapelas e Gravata Dourada
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(px - 5, py - 27, 10, 8);
            ctx.fillStyle = '#f59e0b'; // Gravata
            ctx.fillRect(px - 1, py - 26, 2, 6);
        } else if (player.clothing && player.clothing.id === 'academic') {
            // Traje Académico do IST: Capa Negra Alfacinha
            ctx.fillStyle = '#090d16';
            ctx.fillRect(px - 8, py - 28, 16, 12);
            ctx.fillStyle = '#fbbf24'; // Alfinete de curso
            ctx.fillRect(px + 4, py - 26, 2, 2);
        }
    } else {
        // Fallback procedural clássico enquanto a spritesheet carrega
        drawProceduralPlayer(px, py);
    }

    // Balão de Pensamento Cómico (quando parado)
    if (player.thoughtEmoji && !player.walking) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(px + 10, py - 46, 26, 18);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 10, py - 46, 26, 18);
        // Pequenos círculos do balão
        ctx.fillRect(px + 7, py - 30, 3, 3);
        ctx.fillRect(px + 4, py - 26, 2, 2);

        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(player.thoughtEmoji, px + 23, py - 32);
    }
}

// Fallback procedural clássico do jogador
function drawProceduralPlayer(px, py) {
    const bob = player.walking ? (player.frame % 2 === 0 ? 0 : -3) : (Math.sin(animTimer * 3) * 0.8);

    // Ténis brancos com sola vermelha
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px - 6, py + 8 + bob, 5, 4);
    ctx.fillRect(px + 2, py + 8 + bob, 5, 4);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(px - 6, py + 11 + bob, 5, 1);
    ctx.fillRect(px + 2, py + 11 + bob, 5, 1);

    // Calças escuras
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(px - 6, py + 2 + bob, 4, 7);
    ctx.fillRect(px + 2, py + 2 + bob, 4, 7);

    // Mochila nas costas saltitante
    ctx.fillStyle = '#334155';
    ctx.fillRect(px - 10, py - 6 + bob, 4, 9);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(px - 9, py - 4 + bob, 2, 2);

    // Casaco Tech Azul
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(px - 7, py - 8 + bob, 15, 11);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(px, py - 7 + bob, 1, 9);

    // Cabeça Expressiva
    ctx.fillStyle = '#fbcfe8';
    ctx.fillRect(px - 7, py - 21 + bob, 15, 13);
    ctx.fillStyle = '#1c1917';
    ctx.fillRect(px - 8, py - 23 + bob, 17, 4);
    ctx.fillStyle = '#292524';
    ctx.fillRect(px - 7, py - 12 + bob, 15, 4);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(px - 6, py - 18 + bob, 6, 5);
    ctx.fillRect(px + 1, py - 18 + bob, 6, 5);
}

// Renderizar partículas flutuantes e poeira com alto contraste
function renderParticles() {
    renderDust();

    particles.forEach(pt => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.font = 'bold 11.5px "Fira Code"';
        ctx.textAlign = 'center';

        // Contorno negro de alto contraste para visibilidade máxima
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeText(pt.text, pt.x, pt.y);

        // Texto Colorido
        ctx.fillStyle = pt.color;
        ctx.fillText(pt.text, pt.x, pt.y);
        ctx.restore();
    });
}

// ============================================================================
// NOVO HUD PERFEITAMENTE PROPORCIONADO (Zero Overlap de Caixas)
// ============================================================================
function renderHUD() {
    const hy = 295;
    ctx.fillStyle = '#0b0e14';
    ctx.fillRect(0, hy, canvas.width, 65);
    ctx.strokeStyle = '#233148';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, hy, canvas.width, 65);

    // Slot 1: Relógio & Dia (x: 8, w: 84)
    ctx.fillStyle = '#151d2c';
    ctx.fillRect(8, hy + 8, 84, 48);
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1;
    ctx.strokeRect(8, hy + 8, 84, 48);

    ctx.fillStyle = '#f59e0b';
    ctx.font = '8px "Press Start 2P"';
    ctx.textAlign = 'left';
    ctx.fillText(`DIA ${player.day}`, 14, hy + 24);

    const hh = String(player.timeHour).padStart(2, '0');
    const mm = String(player.timeMinute).padStart(2, '0');
    ctx.fillStyle = '#ffffff';
    ctx.font = '13px "Press Start 2P"';
    ctx.fillText(`${hh}:${mm}`, 14, hy + 46);

    // Slot 2: Finanças (€) (x: 97, w: 110)
    ctx.fillStyle = '#151d2c';
    ctx.fillRect(97, hy + 8, 110, 48);
    ctx.strokeStyle = '#233148';
    ctx.strokeRect(97, hy + 8, 110, 48);

    ctx.fillStyle = '#10b981';
    ctx.font = 'bold 10.5px "Fira Code"';
    ctx.fillText(`💵 MÃO: ${player.wallet}€`, 104, hy + 26);
    ctx.fillStyle = '#38bdf8';
    ctx.fillText(`🏦 BANCO: ${player.bank}€`, 104, hy + 46);

    // Slot 3: Habitação & Renda (x: 212, w: 125)
    ctx.fillStyle = '#151d2c';
    ctx.fillRect(212, hy + 8, 125, 48);
    ctx.strokeStyle = '#233148';
    ctx.strokeRect(212, hy + 8, 125, 48);

    ctx.fillStyle = '#f1f5f9';
    ctx.font = 'bold 9.5px "Fira Code"';
    ctx.fillText(HOUSES[player.houseIndex].name, 218, hy + 25);

    if (player.houseIndex === 0) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 8.5px "Fira Code"';
        ctx.fillText("Sem Renda (Rossio)", 218, hy + 45);
    } else {
        const rentColor = player.daysUntilRent <= 2 ? '#ef4444' : (player.daysUntilRent <= 3 ? '#f59e0b' : '#10b981');
        ctx.fillStyle = rentColor;
        ctx.font = 'bold 9px "Fira Code"';
        ctx.fillText(`Renda (${HOUSES[player.houseIndex].rent}€): ${player.daysUntilRent}d`, 218, hy + 45);
    }

    // Slot 4: Emprego Atual & Curso (x: 342, w: 110)
    const curJob = getPlayerJob();
    const isEmployed = (player.currentWorkplace && WORKPLACES[player.currentWorkplace]);
    const curWp = isEmployed ? WORKPLACES[player.currentWorkplace] : { icon: '💼', name: 'Desempregado' };

    ctx.fillStyle = '#151d2c';
    ctx.fillRect(342, hy + 8, 110, 48);
    ctx.strokeStyle = '#233148';
    ctx.strokeRect(342, hy + 8, 110, 48);

    ctx.fillStyle = isEmployed ? '#facc15' : '#94a3b8';
    ctx.font = 'bold 8px "Fira Code"';
    let jobTitleShort = isEmployed ? `${curWp.icon} ${curJob.title}` : "💼 Desempregado";
    if (ctx.measureText(jobTitleShort).width > 98) {
        while (ctx.measureText(jobTitleShort + '..').width > 98 && jobTitleShort.length > 4) {
            jobTitleShort = jobTitleShort.slice(0, -1);
        }
        jobTitleShort += '..';
    }
    ctx.fillText(jobTitleShort, 348, hy + 24);

    const curCourseShort = player.enrolledCourse ? COURSES[player.enrolledCourse].shortName : "Sem Curso";
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 7.5px "Fira Code"';
    ctx.fillText(`🎓 ${curCourseShort} (${player.ects}e)`, 348, hy + 45);

    // Slot 5: Vestuário & Desgaste (x: 456, w: 70) - Anti-Calções & Nudez
    const isNude = (!player.clothing || player.clothing.id === 'nude' || player.clothing.durability <= 0);
    const clothColor = isNude ? '#ef4444' : (player.clothing.durability <= 25 ? '#f59e0b' : '#10b981');

    ctx.fillStyle = isNude ? '#450a0a' : '#151d2c';
    ctx.fillRect(456, hy + 8, 70, 48);
    ctx.strokeStyle = isNude ? '#ef4444' : '#233148';
    ctx.strokeRect(456, hy + 8, 70, 48);

    ctx.fillStyle = clothColor;
    ctx.font = 'bold 8px "Fira Code"';
    ctx.fillText(isNude ? "🔞 NU!" : `${player.clothing.icon} ${player.clothing.name.slice(0, 7)}`, 460, hy + 24);

    ctx.fillStyle = clothColor;
    ctx.font = 'bold 7.5px "Fira Code"';
    ctx.fillText(isNude ? "CENSURADO" : `DUR: ${player.clothing.durability}%`, 460, hy + 45);

    // Slot 6: Fome & Sanidade (x: 530, w: 48)
    ctx.fillStyle = '#151d2c';
    ctx.fillRect(530, hy + 8, 48, 48);
    ctx.strokeStyle = '#233148';
    ctx.strokeRect(530, hy + 8, 48, 48);

    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 7px "Fira Code"';
    ctx.fillText("FOM", 533, hy + 21);
    ctx.fillStyle = '#334155';
    ctx.fillRect(550, hy + 14, 24, 7);
    ctx.fillStyle = player.hunger > 30 ? '#f59e0b' : '#ef4444';
    ctx.fillRect(550, hy + 14, (player.hunger / 100) * 24, 7);

    ctx.fillStyle = '#94a3b8';
    ctx.fillText("SAN", 533, hy + 43);
    ctx.fillStyle = '#334155';
    ctx.fillRect(550, hy + 36, 24, 7);
    ctx.fillStyle = player.sanity > 30 ? '#06b6d4' : '#ef4444';
    ctx.fillRect(550, hy + 36, (player.sanity / 100) * 24, 7);

    // Slot 7: Botão Dormir / Terminar Turno (x: 582, w: 52)
    const btnDormirX = 582;
    const isHoverBtn = (mouse.x >= btnDormirX && mouse.x <= btnDormirX + 64 && mouse.y >= hy + 8 && mouse.y <= hy + 56);
    ctx.fillStyle = isHoverBtn ? '#ea580c' : '#c2410c';
    ctx.fillRect(btnDormirX, hy + 8, 64, 48);
    ctx.strokeStyle = '#f97316';
    ctx.lineWidth = 1;
    ctx.strokeRect(btnDormirX, hy + 8, 64, 48);

    ctx.fillStyle = '#ffffff';
    ctx.font = '7.5px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText("💤 DIA", btnDormirX + 32, hy + 26);
    ctx.font = 'bold 8.5px "Fira Code"';
    ctx.fillText("SEGUINTE", btnDormirX + 32, hy + 42);
}

// Renderizador de Retratos em Pixel Art 16-Bit Suave e Sem Flickering
function drawNpcPortrait(id, x, y, size) {
    const npc = NPC_INFO[id] || NPC_INFO.senhorio;

    // 1. Moldura Externa Elegante com Borda Dourada / Temática
    ctx.fillStyle = '#090d16';
    ctx.fillRect(x - 2, y - 2, size + 4, size + 4);
    
    // Borda elegante com a cor de assinatura do NPC
    ctx.strokeStyle = npc.color;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x - 2, y - 2, size + 4, size + 4);

    // Cantos decorativos de estilo retro RPG
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(x - 3, y - 3, 3, 3);
    ctx.fillRect(x + size, y - 3, 3, 3);
    ctx.fillRect(x - 3, y + size, 3, 3);
    ctx.fillRect(x + size, y + size, 3, 3);

    const npcCoords = {
        senhorio: { col: 0, row: 0 },
        tasca: { col: 1, row: 0 },
        startup: { col: 2, row: 0 },
        supermercado: { col: 3, row: 0 },
        banco: { col: 0, row: 1 },
        faculdade: { col: 1, row: 1 },
        miradouro: { col: 2, row: 1 },
        casa: { col: 3, row: 1 }
    };

    const coord = npcCoords[id] || npcCoords.senhorio;

    // Respiração Suave (1 pixel de deslocamento arredondado, sem jitter subpixel)
    const breathY = Math.round(Math.sin(animTimer * 2.0));

    ctx.save();
    ctx.beginPath();
    ctx.rect(x + 1, y + 1, size - 2, size - 2);
    ctx.clip();

    if (portraitsSheetImg.complete && portraitsSheetImg.naturalWidth > 0) {
        ctx.imageSmoothingEnabled = false;
        // Desenha o sprite 128x128 com respiração natural de 1px
        ctx.drawImage(
            portraitsSheetImg,
            coord.col * 128, coord.row * 128, 128, 128,
            x + 1, y + 1 + breathY, size - 2, size - 2
        );

        // Acessórios e Efeitos Ambientais Elegantes nos Cantos (sem tapar o rosto):
        if (id === 'banco') {
            // Brilho dourado suave no canto da moldura (fade suave a cada 3.5s)
            const glintCycle = (animTimer % 3.5) / 3.5;
            if (glintCycle < 0.25) {
                const alpha = Math.sin((glintCycle / 0.25) * Math.PI);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
                const gx = x + size - 14, gy = y + 12;
                ctx.fillRect(gx - 4, gy, 9, 2);
                ctx.fillRect(gx, gy - 4, 2, 9);
            }
        } else if (id === 'startup') {
            // LED de status online ciano pulsante no canto
            const pulse = (Math.sin(animTimer * 4.0) + 1) / 2;
            ctx.fillStyle = `rgba(56, 189, 248, ${0.4 + pulse * 0.55})`;
            ctx.beginPath();
            ctx.arc(x + 10, y + 10, 3, 0, Math.PI * 2);
            ctx.fill();
        } else if (id === 'miradouro') {
            // Notas musicais com subida contínua e fade out gradual
            const t1 = (animTimer * 0.4) % 1.0;
            const t2 = ((animTimer * 0.4) + 0.5) % 1.0;
            const ny1 = y + size - 10 - (t1 * 50);
            const ny2 = y + size - 10 - (t2 * 50);
            const a1 = Math.sin(t1 * Math.PI);
            const a2 = Math.sin(t2 * Math.PI);

            ctx.font = 'bold 10px "Press Start 2P"';
            ctx.fillStyle = `rgba(56, 189, 248, ${a1 * 0.9})`;
            ctx.fillText("♪", x + size - 16, ny1);
            ctx.fillStyle = `rgba(250, 204, 21, ${a2 * 0.9})`;
            ctx.fillText("♫", x + size - 24, ny2);
        } else if (id === 'tasca') {
            // Badge artesanal no canto com caneca de imperial
            ctx.fillStyle = 'rgba(217, 119, 6, 0.35)';
            ctx.fillRect(x + size - 18, y + size - 18, 14, 14);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(x + size - 16, y + size - 14, 8, 8);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + size - 17, y + size - 16, 10, 3);
        } else if (id === 'supermercado') {
            // Mini badge de desconto Poupa Mais no canto
            ctx.fillStyle = 'rgba(21, 128, 61, 0.4)';
            ctx.fillRect(x + size - 20, y + size - 16, 16, 12);
            ctx.fillStyle = '#86efac';
            ctx.font = 'bold 7px "Fira Code"';
            ctx.fillText("PD", x + size - 18, y + size - 7);
        } else if (id === 'senhorio') {
            // Selo de contrato com carimbo vermelho no canto
            ctx.fillStyle = 'rgba(185, 28, 28, 0.4)';
            ctx.fillRect(x + size - 18, y + size - 18, 14, 14);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 1;
            ctx.strokeRect(x + size - 18, y + size - 18, 14, 14);
            ctx.fillStyle = '#fca5a5';
            ctx.fillRect(x + size - 14, y + size - 14, 6, 6);
        }
        ctx.restore();
        return;
    }

    // Fallback procedural clássico enquanto a spritesheet carrega
    ctx.fillStyle = npc.color + '44';
    ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
    ctx.restore();
}

function renderInteriorScene(ctx, id, animTimer, player, HOUSES, WORKPLACES, getPlayerJob) {
    ctx.save();

    const img = interiorImgs[id];
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.imageSmoothingEnabled = false;
        // Desenha o cenário interior 16-bit com a mesma resolução e riqueza artística do tabuleiro principal (assets/board.png)
        ctx.drawImage(img, 0, 0, 640, 295);

        // Overlay suave de iluminação dinâmica horária de Lisboa
        const hr = player.timeHour;
        if (hr >= 20 || hr < 7) {
            ctx.fillStyle = 'rgba(11, 15, 26, 0.32)';
            ctx.fillRect(0, 0, 640, 295);
        } else if (hr >= 17 && hr <= 19) {
            ctx.fillStyle = 'rgba(245, 158, 11, 0.12)';
            ctx.fillRect(0, 0, 640, 295);
        }
    } else {
        // Fallback procedural enquanto a imagem carrega
        if (id === 'supermercado') {
            renderInteriorPingoDoce(ctx, animTimer);
        } else if (id === 'tasca') {
            renderInteriorTasca(ctx, animTimer);
        } else if (id === 'banco') {
            renderInteriorBanco(ctx, animTimer);
        } else if (id === 'startup') {
            renderInteriorStartup(ctx, animTimer);
        } else if (id === 'senhorio') {
            renderInteriorSenhorio(ctx, animTimer);
        } else if (id === 'faculdade') {
            renderInteriorFaculdade(ctx, animTimer);
        } else if (id === 'casa') {
            renderInteriorCasa(ctx, animTimer, player, HOUSES);
        } else if (id === 'miradouro') {
            renderInteriorMiradouro(ctx, animTimer);
        }
    }

    ctx.restore();
}

function renderInteriorCasa(ctx, animTimer, player, HOUSES) {
    const idx = player.houseIndex;

    if (idx === 0) {
        // Banco de Jardim no Rossio (Ao relento à noite)
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, 640, 295);
        // Estrelas
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 40; i++) {
            ctx.fillRect((i * 37) % 640, (i * 23) % 150, 2, 2);
        }
        // Candeeiro da CML a alumiar o banco
        ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
        ctx.beginPath(); ctx.arc(100, 180, 80, 0, Math.PI * 2); ctx.fill();
        // Calçada e banco de ferro
        ctx.fillStyle = '#334155'; ctx.fillRect(0, 180, 640, 115);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(40, 210, 120, 14); // Banco

    }

    if (idx === 1) {
        // Beliche Rotativo em Arroios (Hostel superlotado)

        // Paredes simples

        ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, 45); ctx.lineTo(640, 55); ctx.stroke();
        // Meias a secar
        for (let x = 30; x < 630; x += 45) {
            ctx.fillStyle = (x % 2 === 0) ? '#ef4444' : '#3b82f6';

        }

        ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 160, 640, 135);

        return;
    }

    if (idx === 2) {
        // Quarto nos Anjos (Acolhedor com janela)
        ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, 640, 295);
        ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, 0, 640, 155);

    }

    if (idx === 3) {
        // Cave Húmida em Alfama (Arco de pedra e azulejos)
        ctx.fillStyle = '#1c1917'; ctx.fillRect(0, 0, 640, 295);
        // Arco de cantaria
        ctx.fillStyle = '#44403c'; ctx.fillRect(0, 0, 640, 160);
        ctx.strokeStyle = '#78716c'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(320, 160, 260, Math.PI, 0); ctx.stroke();
        // Azulejos azuis
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 110, 640, 50);
        ctx.strokeStyle = '#2563eb'; ctx.strokeRect(0, 110, 640, 50);
        ctx.fillStyle = '#78350f'; ctx.fillRect(0, 160, 640, 135);
        return;
    }

    // idx === 4: T1 Pombalino no Chiado (Luxo, Estuques, Varanda Francesa sobre o Tejo)
    ctx.fillStyle = '#fef3c7'; ctx.fillRect(0, 0, 640, 295);
    // Estuques dourados de teto

    ctx.fillRect(230, 35, 24, 120);
    ctx.fillRect(386, 35, 24, 120);

    ctx.fillStyle = '#b45309'; ctx.fillRect(0, 160, 640, 135);
}
